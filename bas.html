<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- säkerhetsregel: sidan får bara ladda filer från sajten själv (plus blob:/data: som notprogrammet
     använder internt). Inga externa skript, typsnitt eller anrop, inte ens om något skulle injiceras. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' blob: data:; worker-src 'self' blob:; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'none'">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%227%22 fill=%22%23b0502a%22/%3E%3Ctext x=%2216%22 y=%2223%22 font-size=%2219%22 font-family=%22Georgia,serif%22 font-weight=%22700%22 text-anchor=%22middle%22 fill=%22white%22%3ET%3C/text%3E%3C/svg%3E">
<title>Teknikkort</title>
<!-- allt hämtas från sajten själv (material/lib), inga anrop till andra tjänster -->
<script src="lib/alphatab/alphaTab.min.js"></script>
<style>
@font-face { font-family: "Fraunces"; src: url("lib/fonts/fraunces.woff2") format("woff2"); font-weight: 500 700; font-display: swap; }
@font-face { font-family: "Inter"; src: url("lib/fonts/inter.woff2") format("woff2"); font-weight: 400 700; font-display: swap; }
:root {
  color-scheme: light;
  --paper: #f7f3ec;
  --card: #ffffff;
  --ink: #1f1c18;
  --muted: #6f675c;
  --line: #e4dccf;
  --accent: #b0502a;
  --accent-ink: #ffffff;
  --accent-soft: #f5e4da;
  /* en färg per block: 0 = förberedelse, A–D = kapitlets block */
  --b0: #8a6a1f; --b0-soft: #f3ead2;
  --bA: #b0502a; --bA-soft: #f5e4da;
  --bB: #4b6a78; --bB-soft: #e1ebef;
  --bC: #5f7a3a; --bC-soft: #e6eedb;
  --bD: #7a4b6e; --bD-soft: #f0e3ec;
  --bE: #2f6f73; --bE-soft: #dcecec;
  --bF: #55558a; --bF-soft: #e5e5f2;
  --ok: #3d7a4b;
  --ny: #2f68a8; /* nya toner i greppbilden (t.ex. mollskalans 2:a och ♭6) */
  --radius: 14px;
  --serif: "Fraunces", Georgia, serif;
  --sans: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--paper); color: var(--ink); font: 15px/1.55 var(--sans); }
a { color: inherit; }
button { font: inherit; color: inherit; }

/* ---------- toppen ---------- */
.topbar {
  position: sticky; top: 0; z-index: 2100;
  display: flex; align-items: center; gap: 16px;
  padding: 10px 20px; background: var(--ink); color: #f7f3ec;
}
.brand { text-decoration: none; color: inherit; font-family: var(--serif); font-weight: 700; font-size: 19px; letter-spacing: .2px; white-space: nowrap; }
.brand span { color: #e9a07f; }
.doman { font-size: 12.5px; font-weight: 600; color: #bfb5a6; letter-spacing: .02em; white-space: nowrap; }
.doman[hidden], .utskrift-adress { display: none; }
.inst-switch { display: flex; background: #3a352e; border-radius: 999px; padding: 3px; }
.inst-switch a { text-decoration: none; padding: 4px 12px; border-radius: 999px; font-size: 13px; font-weight: 600; color: #cfc6b8; }
.inst-switch a.on { background: #f7f3ec; color: var(--ink); }
.topbar .spacer { flex: 1; }
.stod { display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border-radius: 999px;
  color: #bfb5a6; font-size: 13px; font-weight: 600; text-decoration: none; white-space: nowrap; }
.stod:hover { color: #e9a07f; background: #3a352e; }
.stod[hidden] { display: none; }
#kortval { display: none; max-width: 100%; padding: 6px 8px; border-radius: 8px; border: 0; font: inherit; font-size: 14px; }

/* ---------- layout ---------- */
.layout { display: grid; grid-template-columns: 290px minmax(0, 1fr); align-items: start; }
.sidebar {
  position: sticky; top: 52px; height: calc(100vh - 52px); overflow-y: auto;
  padding: 18px 14px 40px; border-right: 1px solid var(--line);
}
.nav-kap { margin-bottom: 18px; }
.nav-kap h3 { margin: 0; font-family: var(--serif); font-size: 17px; }
.nav-kap summary, .nav-blk summary { list-style: none; cursor: pointer; display: flex; align-items: flex-start; gap: 6px; border-radius: 8px; }
.nav-kap summary::-webkit-details-marker, .nav-blk summary::-webkit-details-marker { display: none; }
.nav-kap > summary { padding: 4px 6px; }
.nav-kap summary:hover, .nav-blk summary:hover { background: #ece5d9; }
.nav-kap summary::before, .nav-blk summary::before {
  content: ""; flex: none; width: 7px; height: 7px; margin: 0 4px 0 2px;
  border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted);
  transform: rotate(-45deg); transition: transform .15s;
}
.nav-kap > summary::before { margin-top: 24px; }
.nav-blk > summary::before { margin-top: 3px; }
.nav-kap[open] > summary::before, .nav-blk[open] > summary::before { transform: rotate(45deg); }
.nav-kap > p { margin-left: 25px !important; }
.nav-blk > summary { margin: 8px 0 2px; padding: 3px 6px; }
.nav-blk > summary h4 { margin: 0; }
.nav-verktyg { display: flex; gap: 12px; margin: 0 6px 12px; font-size: 12px; }
.nav-verktyg button { border: 0; background: none; padding: 0; color: var(--muted); cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
.nav-verktyg button:hover { color: var(--ink); }
.nav-kap h3 span { display: block; font-family: var(--sans); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
.nav-kap p { margin: 2px 6px 8px; font-size: 12.5px; color: var(--muted); line-height: 1.45; }
.nav-kap h4 { margin: 0; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.nav-item { display: grid; grid-template-columns: 38px 1fr auto; align-items: center; gap: 6px; padding: 5px 6px; border-radius: 8px; text-decoration: none; font-size: 13.5px; }
.nav-item:hover { background: #ece5d9; }
.nav-item.aktiv { background: var(--ink); color: #fff; }
.nav-item .nid { font-variant-numeric: tabular-nums; font-weight: 600; color: var(--muted); }
.nav-item.aktiv .nid { color: #e9a07f; }
.nav-kap h4.b0 { color: var(--b0); } .nav-kap h4.bA { color: var(--bA); } .nav-kap h4.bB { color: var(--bB); }
.nav-kap h4.bC { color: var(--bC); } .nav-kap h4.bD { color: var(--bD); }
.nav-kap h4.bE { color: var(--bE); } .nav-kap h4.bF { color: var(--bF); }
.nav-item.aktiv .nt { color: #fff; }
.prog { font-size: 9px; letter-spacing: 1px; color: var(--ok); white-space: nowrap; }
.bock { display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; background: var(--ok); color: #fff; font-size: 11px; font-weight: 700; letter-spacing: 0; }
.nav-item.klar .nid { color: var(--ok); }
.nav-item.aktiv.klar .nid { color: #9fd3ab; }
.raknare { margin-left: 6px; font-family: var(--sans); font-size: 11px; font-style: normal; font-weight: 600; letter-spacing: 0; text-transform: none; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.raknare.allt { color: var(--ok); }
.nav-kap h3.allt-klart, .nav-kap h3.allt-klart span, .nav-kap h4.allt-klart { color: var(--ok); }

main { padding: 26px 28px 0; min-width: 0; }
.kort { max-width: 1000px; margin: 0 auto; }

/* ---------- kortets huvud ---------- */
.kort-head { display: flex; align-items: center; gap: 18px; margin-bottom: 18px; }
.kort-id {
  flex: none; min-width: 74px; height: 74px; padding: 0 10px; border-radius: 16px; background: var(--accent); color: var(--accent-ink);
  display: grid; place-items: center; font-family: var(--serif); font-weight: 700; font-size: 30px; font-variant-numeric: tabular-nums;
}
.kort-head .kap { font-size: 12.5px; color: var(--muted); letter-spacing: .02em; }
.kort-head h1 { margin: 2px 0 0; font-family: var(--serif); font-weight: 700; font-size: 30px; line-height: 1.15; }
.badge { margin-left: auto; align-self: flex-start; padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
.badge.b0 { background: var(--b0-soft); color: var(--b0); }
.badge.bA { background: var(--bA-soft); color: var(--bA); }
.badge.bB { background: var(--bB-soft); color: var(--bB); }
.badge.bC { background: var(--bC-soft); color: var(--bC); }
.badge.bD { background: var(--bD-soft); color: var(--bD); }
.badge.bE { background: var(--bE-soft); color: var(--bE); }
.badge.bF { background: var(--bF-soft); color: var(--bF); }

/* ---------- paneler ---------- */
.panel { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; }
.panel h2 { margin: 0 0 8px; font-size: 11.5px; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; margin-bottom: 14px; }
.grid2.bred { grid-template-columns: 1fr; }
.grid3 { display: grid; grid-template-columns: 1fr 1.3fr 1fr; gap: 14px; margin: 14px 0; }
.formel { margin: 0 0 6px; font-family: var(--serif); font-size: 19px; line-height: 1.35; }
.panel p { margin: 0; }
.panel ul { margin: 0; padding-left: 18px; }
.panel li + li { margin-top: 4px; }
.diagram-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
.diagram-head h2 { margin: 0; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 2px; background: var(--paper); }
.seg button { border: 0; background: none; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; color: var(--muted); cursor: pointer; }
.seg button.on { background: var(--ink); color: #fff; }
#diagram svg { display: block; width: 100%; height: auto; }
.at-wrap { min-height: 60px; overflow-x: auto; }
.panel { min-width: 0; }
.status { font-size: 12.5px; color: var(--muted); }
.diagram-not { margin: 6px 0 0; font-size: 12.5px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.ny-prick { width: 11px; height: 11px; border-radius: 50%; background: var(--ny); display: inline-block; }

/* tempotrappa */
.trappa { display: flex; flex-wrap: wrap; gap: 8px; }
.trappa label { display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border: 1px solid var(--line); border-radius: 10px; font-variant-numeric: tabular-nums; font-weight: 600; cursor: pointer; background: var(--paper); }
.trappa input { accent-color: var(--ok); width: 16px; height: 16px; margin: 0; }
.trappa label.klar { border-color: var(--ok); color: var(--ok); background: #eaf3ec; }

/* start här (genomgång) */
.guide { max-width: 1000px; margin: 0 auto; }
.guide[hidden], .kort[hidden] { display: none; }
body.guidelage .player { display: none; }
.kort-id.start-id { font-size: 20px; }
.guide-toc { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 16px; }
.guide-toc button { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 5px 12px; font-size: 13px; font-weight: 600; cursor: pointer; }
.guide-toc button:hover { border-color: var(--ink); }
.guide-sek { margin-bottom: 14px; scroll-margin-top: 70px; }
.panel h2.guide-rubrik { display: flex; align-items: center; gap: 10px; margin: 0 0 10px; font-family: var(--serif); font-size: 22px; font-weight: 700; letter-spacing: 0; text-transform: none; color: var(--ink); }
.guide-rubrik span { flex: none; display: grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; background: var(--accent); color: #fff; font-family: var(--sans); font-size: 14px; }
.guide-text { max-width: 72ch; font-size: 15.5px; }
.guide-text p { margin: 0 0 8px; }
.guide-text ul { margin: 0 0 8px; padding-left: 20px; }
.guide-text li + li { margin-top: 5px; }
.guide-ex { margin: 14px 0 0; padding: 14px; border-radius: 12px; background: var(--paper); border: 1px solid var(--line); }
.guide-ex .diagram-head { justify-content: flex-end; }
.guide-ex figcaption { margin-top: 8px; font-size: 13px; color: var(--muted); }
.guide-start { display: flex; gap: 12px; flex-wrap: wrap; margin: 20px 0 30px; }
.guide-start .klar-nasta { padding: 14px 22px; }
.guide-start .klar-nasta.alt { background: var(--ink); }
.donation { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; border: 1px dashed var(--line); color: var(--muted); }
.donation-ikon { flex: none; display: inline-flex; color: #d9cfbf; }
.donation-text { flex: 1; min-width: 200px; }
.donation-knapp { flex: none; padding: 8px 15px; border-radius: 999px; background: var(--accent); color: #fff; font-weight: 700; text-decoration: none; white-space: nowrap; }
.donation-knapp:hover { filter: brightness(1.12); }
.guide .donation { margin: 0 0 30px; padding: 14px 16px; border-radius: 12px; font-size: 14px; }
.metro-slag { display: flex; gap: 12px; margin-bottom: 12px; }
.metro-slag span { width: 38px; height: 38px; border-radius: 50%; border: 2px solid var(--line); background: #fff; display: grid; place-items: center; font-weight: 700; color: var(--muted); }
.metro-slag span.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.metro-slag span:first-child.on { background: var(--ink); border-color: var(--ink); }
.metro-knappar { display: flex; gap: 8px; flex-wrap: wrap; }
.metro-knapp { border: 1px solid var(--line); background: #fff; border-radius: 10px; padding: 7px 14px; font-weight: 700; cursor: pointer; font-variant-numeric: tabular-nums; }
.metro-knapp:hover { border-color: var(--ink); }
.metro-knapp.on { background: var(--ink); color: #fff; border-color: var(--ink); }
.nav-item.nav-start { margin: 0 0 14px; background: var(--accent-soft); }
.nav-item.nav-start .nid { color: var(--accent); }
.nav-item.nav-start.aktiv { background: var(--ink); }

/* klar-knappen */
.klarbox { display: flex; gap: 12px; align-items: stretch; margin-top: 14px; }
.klarknapp {
  flex: 1; display: flex; align-items: center; gap: 18px; text-align: left; cursor: pointer;
  padding: 16px 20px; border-radius: var(--radius); border: 2px dashed #cfc5b5; background: var(--card);
  transition: background .2s, border-color .2s, transform .1s;
}
.klarknapp:hover { border-color: var(--ok); }
.klarknapp:active { transform: scale(.99); }
.klar-cirkel {
  position: relative; flex: none; width: 56px; height: 56px; border-radius: 50%; border: 3px solid #cfc5b5;
  display: grid; place-items: center; background: #fff; transition: background .2s, border-color .2s;
}
.klar-cirkel svg { width: 30px; height: 30px; fill: none; stroke: #cfc5b5; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 24; stroke-dashoffset: 24; }
.klarknapp:not(.klar):hover .klar-cirkel svg { stroke-dashoffset: 0; }
.klar-text strong { display: block; font-family: var(--serif); font-size: 21px; line-height: 1.25; }
.klar-text span { color: var(--muted); font-size: 14px; }
.klarknapp.klar { border-style: solid; border-color: var(--ok); background: #eaf3ec; }
.klarknapp.klar .klar-cirkel { background: var(--ok); border-color: var(--ok); }
.klarknapp.klar .klar-cirkel svg { stroke: #fff; stroke-dashoffset: 0; transition: stroke-dashoffset .35s .1s ease-out; }
.klarknapp.klar strong { color: var(--ok); }
.klarknapp.pop .klar-cirkel { animation: pop .45s cubic-bezier(.2, 1.6, .4, 1); }
@keyframes pop { 0% { transform: scale(.7); } 60% { transform: scale(1.15); } 100% { transform: scale(1); } }
.klar-nasta { display: flex; align-items: center; padding: 0 22px; border-radius: var(--radius); background: var(--ok); color: #fff; font-weight: 700; text-decoration: none; white-space: nowrap; }
.klar-nasta:hover { filter: brightness(1.1); }
.klar-nasta[hidden] { display: none; }
.konfetti { position: absolute; left: 50%; top: 50%; width: 8px; height: 8px; border-radius: 2px; pointer-events: none; animation: konfetti .75s ease-out forwards; }
@keyframes konfetti {
  from { transform: translate(-50%, -50%) rotate(0); opacity: 1; }
  to { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) rotate(var(--rot)); opacity: 0; }
}
.klar-chip { align-self: flex-start; padding: 4px 10px; border-radius: 999px; background: var(--ok); color: #fff; font-size: 12px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
.klar-chip[hidden] { display: none; }
@media (prefers-reduced-motion: reduce) {
  .klarknapp.pop .klar-cirkel { animation: none; }
  .konfetti { display: none; }
}

.prevnext { display: flex; justify-content: space-between; gap: 10px; margin: 18px 0 24px; }
.prevnext a { text-decoration: none; padding: 9px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); font-weight: 600; font-size: 14px; }
.prevnext a:hover { border-color: var(--ink); }
.prevnext a[hidden] { display: none; }

/* ---------- spelaren ---------- */
.player {
  position: sticky; bottom: 0; z-index: 2000; margin: 0 -28px; padding: 10px 28px;
  background: rgba(31, 28, 24, .96); color: #f7f3ec; backdrop-filter: blur(6px);
}
.player-inner { max-width: 1000px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; }
.pbtn { border: 0; cursor: pointer; border-radius: 999px; background: #3a352e; color: #f7f3ec; height: 38px; min-width: 38px; padding: 0 12px; font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.pbtn:hover { background: #4a443b; }
.pbtn.play { background: var(--accent); width: 46px; height: 46px; font-size: 18px; padding: 0; }
.pbtn.play:disabled { opacity: .5; cursor: wait; }
.tempo { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
.tempo .bpm { min-width: 74px; text-align: center; font-variant-numeric: tabular-nums; font-weight: 700; font-size: 15px; }
.chip { border: 1px solid #5a5248; background: none; color: #d9d0c2; border-radius: 8px; padding: 3px 8px; font-size: 12.5px; font-weight: 600; cursor: pointer; font-variant-numeric: tabular-nums; }
.chip.on { background: #f7f3ec; color: var(--ink); border-color: #f7f3ec; }
.toggles { display: flex; gap: 6px; flex-wrap: wrap; }
.tog { border: 1px solid #5a5248; background: none; color: #bfb5a6; border-radius: 999px; padding: 5px 11px; font-size: 12.5px; font-weight: 600; cursor: pointer; }
.tog[aria-pressed="true"] { background: #e9a07f; border-color: #e9a07f; color: var(--ink); }
.komp { display: inline-flex; align-items: center; border: 1px solid #5a5248; border-radius: 999px; overflow: hidden; font-size: 12.5px; }
.komp span { padding: 0 8px 0 11px; color: #8f8576; font-weight: 600; }
.kval { border: none; border-left: 1px solid #5a5248; background: none; color: #bfb5a6; padding: 5px 10px; font-size: 12.5px; font-weight: 600; cursor: pointer; }
.kval[aria-pressed="true"] { background: #e9a07f; color: var(--ink); }
.player .status { color: #bfb5a6; margin-left: auto; }

/* alphaTab-markör */
.at-cursor-bar { background: rgba(176, 80, 42, .10); }
.at-cursor-beat { background: var(--accent); width: 3px; }
.at-selection div { background: rgba(176, 80, 42, .15); }
.at-highlight * { fill: var(--accent); stroke: var(--accent); }

/* ---------- mobil ---------- */
@media (max-width: 900px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  .sidebar { display: none; }
  #kortval { display: block; flex: 1; min-width: 0; }
  /* på mobilen behöver kortlistan platsen i toppen; donationen finns på startsidan och i Start här */
  .topbar .stod { display: none; }
  .topbar { flex-wrap: wrap; gap: 8px 12px; padding: 8px 16px; }
  .topbar .spacer { display: none; }
  .doman { display: none; }
  main { padding: 18px 16px 0; }
  .player { margin: 0 -16px; padding: 10px 16px; }
  .grid2, .grid3 { grid-template-columns: minmax(0, 1fr); }
  #chips, #print { display: none; }
  .player-inner { gap: 8px 10px; }
  .pbtn.play { width: 42px; height: 42px; }
  .kort-head { gap: 12px; flex-wrap: wrap; }
  .kort-id { min-width: 58px; height: 58px; font-size: 23px; border-radius: 13px; }
  .kort-head h1 { font-size: 23px; }
  .badge { margin-left: 0; }
  .klarbox { flex-direction: column; }
  .klar-nasta { justify-content: center; padding: 12px; }
  .player .status { margin-left: 0; width: 100%; }
}

/* ---------- utskrift ---------- */
/* ---------- papper ----------
   Papperslayouten (body.pappersvy) används både när Skriv ut förbereder utskriften på skärmen
   (så att kortets höjd kan mätas mot en A4) och vid själva utskriften. Ctrl+P sätter den också. */
.utskrift-formel { display: none; }
body.pappersvy { background: #fff; font-size: 12px; }
body.pappersvy .topbar, body.pappersvy .sidebar, body.pappersvy .player, body.pappersvy .prevnext,
body.pappersvy .at-cursors, body.pappersvy .klarbox, body.pappersvy .klar-chip, body.pappersvy .guide-toc,
body.pappersvy .guide-start, body.pappersvy .metro, body.pappersvy .donation, body.pappersvy .p-cell,
body.pappersvy .diagram-head .seg { display: none !important; }
body.pappersvy .layout { display: block; }
body.pappersvy main { padding: 0; }
body.pappersvy .kort {
  width: 718px; max-width: none; margin: 0;
  display: grid; gap: 8px; align-items: start;
  grid-template-columns: 300px minmax(0, 1fr);
  grid-template-areas: "head head" "diagram mal" "diagram gor" "diagram var" "ovning ovning" "trappa trappa";
}
body.pappersvy .kort.bred-diagram {
  grid-template-columns: 1fr 1.3fr 1fr;
  grid-template-areas: "head head head" "diagram diagram diagram" "mal gor var" "ovning ovning ovning" "trappa trappa trappa";
}
body.pappersvy .grid2, body.pappersvy .grid3 { display: contents; }
body.pappersvy .kort-head { grid-area: head; gap: 12px; margin: 0; }
body.pappersvy .p-diagram { grid-area: diagram; }
body.pappersvy .p-mal { grid-area: mal; }
body.pappersvy .p-gor { grid-area: gor; }
body.pappersvy .p-var { grid-area: var; }
body.pappersvy .ovning { grid-area: ovning; }
body.pappersvy .p-trappa { grid-area: trappa; }
body.pappersvy .kort-head h1 { font-size: 24px; }
body.pappersvy .kort-id { min-width: 56px; height: 56px; font-size: 22px; border-radius: 12px; background: #fff; color: var(--ink); border: 2px solid var(--ink); }
body.pappersvy .utskrift-formel { display: block; margin: 3px 0 0; font-family: var(--serif); font-size: 14px; }
body.pappersvy.har-doman .utskrift-adress { display: block; margin-left: auto; align-self: flex-start; font-weight: 700; font-size: 13px; color: var(--ink); }
body.pappersvy.har-doman .badge { margin-left: 0; }
body.pappersvy .panel { padding: 8px 10px; break-inside: avoid; }
body.pappersvy .panel h2 { margin-bottom: 4px; }
body.pappersvy .p-diagram .diagram-head { margin: 0; }
body.pappersvy #diagram svg { max-height: 175px; }
body.pappersvy .kort.bred-diagram #diagram svg { max-height: 125px; }
body.pappersvy .trappa label { padding: 3px 9px; background: #fff; }
/* uppspelningsmarkörens färg ska inte följa med på papper */
body.pappersvy .at-highlight * { fill: #000 !important; stroke: #000 !important; }
/* alphaTab placerar notraderna absolut; låt dem flyta som vanliga block, så att höjden går att mäta
   och en eventuell sidbrytning hamnar mellan två notrader */
body.pappersvy .panel.ovning { break-inside: auto; }
body.pappersvy .panel.ovning .at-surface { height: auto !important; }
body.pappersvy .panel.ovning .at-surface > div { position: relative !important; top: auto !important; left: auto !important; break-inside: avoid; }
body.pappersvy .guide-sek { break-inside: avoid; }
body.pappersvy .guide-ex:has(.metro) { display: none; }
@media print {
  @page { size: A4; margin: 10mm; }
}
</style>

<div class="layout">
  <aside class="sidebar" id="nav"></aside>

  <main>
    <article class="guide" id="guide" hidden></article>

    <article class="kort" id="kortvy">
      <div class="kort-head">
        <div class="kort-id" id="k-id"></div>
        <div>
          <div class="kap" id="k-kap"></div>
          <h1 id="k-titel"></h1>
          <p class="utskrift-formel" id="k-formel-p"></p>
        </div>
        <span class="badge" id="k-block"></span>
        <span class="klar-chip" id="k-klarchip" hidden>✓ Klar</span>
        <span class="utskrift-adress"></span>
      </div>

      <section class="grid2">
        <div class="panel p-cell">
          <h2>Cellen</h2>
          <p class="formel" id="k-formel"></p>
          <div class="at-wrap" id="cell-at"></div>
        </div>
        <div class="panel p-diagram">
          <div class="diagram-head">
            <h2>Greppbild</h2>
            <div class="seg" id="diag-seg">
              <button data-mode="ro">R / o</button>
              <button data-mode="iv">Intervaller</button>
              <button data-mode="namn">Tonnamn</button>
            </div>
          </div>
          <div id="diagram"></div>
        </div>
      </section>

      <section class="panel ovning">
        <h2>Hela övningen</h2>
        <div class="at-wrap" id="main-at"></div>
      </section>

      <section class="grid3">
        <div class="panel p-mal"><h2>Mål</h2><p id="k-mal"></p></div>
        <div class="panel p-gor"><h2>Så gör du</h2><p id="k-gor"></p></div>
        <div class="panel p-var"><h2>Variationer</h2><ul id="k-var"></ul></div>
      </section>

      <section class="panel p-trappa">
        <h2>Tempotrappa – kryssa när det sitter</h2>
        <div class="trappa" id="k-trappa"></div>
      </section>

      <section class="klarbox">
        <button class="klarknapp" id="klarknapp" aria-pressed="false">
          <span class="klar-cirkel"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>
          <span class="klar-text"><strong id="klar-rubrik"></strong><span id="klar-under"></span></span>
        </button>
        <a class="klar-nasta" id="klar-nasta" href="#" hidden>Nästa kort →</a>
      </section>

      <nav class="prevnext">
        <a id="prev" href="#"></a>
        <a id="next" href="#"></a>
      </nav>
    </article>

    <div class="player">
      <div class="player-inner">
        <button class="pbtn play" id="play" disabled aria-label="Spela">▶</button>
        <button class="pbtn" id="stop" aria-label="Stoppa">■</button>
        <div class="tempo">
          <button class="pbtn" id="slower" aria-label="Långsammare">−</button>
          <span class="bpm" id="bpm">♩ = 60</span>
          <button class="pbtn" id="faster" aria-label="Snabbare">+</button>
          <span id="chips"></span>
        </div>
        <div class="toggles">
          <button class="tog" data-opt="metronom">Metronom</button>
          <button class="tog" data-opt="inrakning">Inräkning</button>
          <button class="tog" data-opt="loop">Loop</button>
        </div>
        <div class="komp" role="group" aria-label="Komp">
          <span>Komp</span>
          <button class="kval" data-komp="av">Av</button>
          <button class="kval" data-komp="bordun">Bordun</button>
          <button class="kval" data-komp="groove">Groove</button>
        </div>
        <button class="pbtn" id="print">Skriv ut</button>
        <span class="status" id="status">Laddar …</span>
      </div>
    </div>
  </main>
</div>

 {"s": 2, "f": 3, "rot": false, "iv": "♭7", "namn": "F", "ny": false}, {"s": 2, "f": 5, "rot": true, "iv": "R", "namn": "G", "ny": false}, {"s": 2, "f": 7, "rot": false, "iv": "2", "namn": "A", "ny": true}, {"s": 2, "f": 8, "rot": false, "iv": "♭3", "namn": "B♭", "ny": false}, {"s": 2, "f": 10, "rot": false, "iv": "4", "namn": "C", "ny": false}, {"s": 2, "f": 12, "rot": false, "iv": "5", "namn": "D", "ny": false}, {"s": 2, "f": 13, "rot": false, "iv": "♭6", "namn": "E♭", "ny": true}, {"s": 2, "f": 15, "rot": false, "iv": "♭7", "namn": "F", "ny": false}, {"s": 2, "f": 17, "rot": true, "iv": "R", "namn": "G", "ny": false}, {"s": 3, "f": 2, "rot": false, "iv": "2", "namn": "A", "ny": true}, {"s": 3, "f": 3, "rot": false, "iv": "♭3", "namn": "B♭", "ny": false}, {"s": 3, "f": 5, "rot": false, "iv": "4", "namn": "C", "ny": false}, {"s": 3, "f": 7, "rot": false, "iv": "5", "namn": "D", "ny": false}, {"s": 3, "f": 8, "rot": false, "iv": "♭6", "namn": "E♭", "ny": true}, {"s": 3, "f": 10, "rot": false, "iv": "♭7", "namn": "F", "ny": false}, {"s": 3, "f": 12, "rot": true, "iv": "R", "namn": "G", "ny": false}, {"s": 3, "f": 14, "rot": false, "iv": "2", "namn": "A", "ny": true}, {"s": 3, "f": 15, "rot": false, "iv": "♭3", "namn": "B♭", "ny": false}, {"s": 3, "f": 17, "rot": false, "iv": "4", "namn": "C", "ny": false}], "las": null}, "tempo": [50, 60, 70, 80, 90, 100, 160], "takter": 12}], "start": [{"id": "valkommen", "rubrik": "Välkommen", "text": "<p>Teknikkorten är korta övningar som bygger på varandra. Du tar <strong>ett kort i taget, i ordning</strong>, och övar några minuter om dagen, gärna som uppvärmning.</p><ul><li><strong>Aldrig spelat?</strong> Börja på kort F1.</li><li><strong>Spelat lite?</strong> Börja direkt på kort 1.</li></ul><p>Den här sidan förklarar allt du ser på korten. Läs den en gång, och kom tillbaka hit när något känns oklart.</p>"}, {"id": "sidan", "rubrik": "Sidan och menyn", "text": "<ul><li><strong>Menyn</strong> till vänster visar alla kort. På mobilen finns den som en lista högst upp.</li><li>Korten är ordnade i <strong>kapitel</strong> och <strong>block</strong>. Varje block har en egen färg. Pilen vid en rubrik fäller ihop eller ut den.</li><li>Övningarna är <strong>numrerade i ordning</strong>: 1, 2, 3 … Förberedelsen för helt nya nybörjare heter F1–F5.</li><li>Knapparna <strong>Gitarr / Elbas</strong> högst upp byter instrument. Du är på elbassidan.</li><li>När du är klar med ett kort får det en <strong>grön bock ✓</strong> i menyn, och rubrikerna räknar hur många du har klarat (till exempel 2/5).</li><li>Bockarna sparas <strong>bara i den här webbläsaren</strong>. På en annan dator eller telefon syns de inte.</li><li>Sidan <strong>samlar inte in några uppgifter</strong> om dig. Det finns inga konton, och inget skickas någonstans.</li></ul>"}, {"id": "instrumentet", "rubrik": "Instrumentet", "text": "<p>Elbasen har <strong>4 strängar</strong>. Från den tjockaste till den tunnaste heter de <strong>E, A, D, G</strong>. När du håller instrumentet är den tjockaste strängen, E, överst, närmast ansiktet.</p><ul><li><strong>Banden</strong> är metallpinnarna på halsen. Band 1 är närmast huvudet, där stämskruvarna sitter. Du trycker ned strängen precis bakom bandet.</li><li>En <strong>öppen sträng</strong> (band 0) betyder att du spelar strängen utan att trycka ned den.</li><li>Vänsterhandens fingrar har nummer: <strong>1 = pekfinger, 2 = långfinger, 3 = ringfinger, 4 = lillfinger</strong>.</li><li><strong>Ett finger per band</strong>: inom en box tar varje finger sitt eget band. Står handen vid band 3 tar pekfingret band 3, långfingret band 4 och så vidare.</li><li>Du slår an strängarna med <strong>pekfingret och långfingret växelvis</strong>: pek, lång, pek, lång … hela tiden, också när du byter sträng. Det kallas <strong>växelfingrar</strong>. Vill du spela med plektrum går det också: då gäller ned, upp, ned, upp.</li></ul>"}, {"id": "greppbild", "rubrik": "Greppbilden", "text": "<p>Greppbilden visar <strong>var på halsen</strong> du ska spela. Den ritas som när du lutar dig fram och tittar ned på halsen medan du spelar. Därför ligger den tjockaste strängen <strong>längst ned</strong> i bilden, fast den är överst när du håller instrumentet.</p><ul><li>De vågräta linjerna är <strong>strängarna</strong>. Strängarnas namn står till vänster.</li><li>De lodräta linjerna är <strong>banden</strong>. Bandnumret står under.</li><li>En <strong>prick</strong> är en ton du ska spela. En <strong>vit ring</strong> är en öppen sträng. En <strong>blå prick</strong> är en ny ton som inte fanns i boxen förut (från kapitel 3).</li><li><strong>R</strong> (orange) är <strong>grundtonen</strong>, tonen som låter \"hemma\". I de här korten är grundtonen G.</li><li>Vissa bandnummer är <strong>fetstilta</strong> (3, 5, 7, 9, 12 …). Det är banden som har en markering, en prick, på halsen. De hjälper dig att hitta rätt.</li></ul><p>Med knapparna uppe till höger kan du byta vad som står i prickarna:</p><ul><li><strong>R / o</strong> visar bara grundtonerna. Börja med det läget.</li><li><strong>Intervaller</strong> visar varje tons avstånd från grundtonen (R, ♭3, 4, 5, ♭7). Det kommer vi till senare.</li><li><strong>Tonnamn</strong> visar vad tonerna heter: G, B♭, C, D och F. Tecknet ♭ betyder en halvton (ett band) lägre: B♭ ligger ett band under B.</li></ul>", "exempel": {"typ": "diagram", "diagram": {"lo": 3, "hi": 6, "strangar": ["E", "A", "D", "G"], "toner": [{"s": 0, "f": 3, "rot": true, "iv": "R", "namn": "G", "ny": false}, {"s": 0, "f": 6, "rot": false, "iv": "♭3", "namn": "B♭", "ny": false}, {"s": 1, "f": 3, "rot": false, "iv": "4", "namn": "C", "ny": false}, {"s": 1, "f": 5, "rot": false, "iv": "5", "namn": "D", "ny": false}, {"s": 2, "f": 3, "rot": false, "iv": "♭7", "namn": "F", "ny": false}, {"s": 2, "f": 5, "rot": true, "iv": "R", "namn": "G", "ny": false}, {"s": 3, "f": 3, "rot": false, "iv": "♭3", "namn": "B♭", "ny": false}, {"s": 3, "f": 5, "rot": false, "iv": "4", "namn": "C", "ny": false}], "las": null}, "text": "Box 1 i G-mollpentatonik, den första boxen du lär dig. Prova knapparna."}}, {"id": "tabb", "rubrik": "Tabulatur (tabb)", "text": "<p>Tabben visar <strong>vilken sträng och vilket band</strong> du ska spela, i rätt ordning.</p><ul><li>Linjerna är strängarna, precis som i greppbilden: <strong>översta linjen är den tunnaste strängen</strong>, nedersta är den tjockaste, E.</li><li>Siffran på en linje säger <strong>vilket band</strong> du ska trycka ned. <strong>0</strong> betyder öppen sträng.</li><li>Du läser från <strong>vänster till höger</strong>, en siffra i taget.</li><li>Strecken under siffrorna visar <strong>rytmen</strong>, alltså hur långa tonerna är. På korten ser du rytmen tydligast i noterna ovanför tabben (se nästa avsnitt).</li></ul>", "exempel": {"typ": "tex", "tex": "\\tempo 80\n\\track \"Elbas\" { instrument 33 }\n\\staff {tabs}\n\\tuning (G2 D2 A1 E1)\n\\clef F4 \\ks Bb 3.4.8 6.4.8 3.3.8 5.3.8 3.2.8 5.2.8 3.1.8 5.1.8", "text": "De åtta första tonerna i box 1: två toner på varje sträng, nedifrån och upp."}}, {"id": "noter", "rubrik": "Noter och rytm", "text": "<p>Du behöver inte kunna läsa noter för att spela korten. Tabben räcker för att veta <em>vilka</em> toner du ska spela. Men noterna visar <strong>rytmen</strong>, alltså <em>när</em> och <em>hur länge</em> varje ton ska låta.</p><ul><li>Noterna står på fem linjer. Tecknet först på raden är en <strong>F-klav (basklav)</strong>. Sedan kommer <strong>förtecknet</strong> (två ♭) som visar tonarten, G-moll.</li><li><strong>4/4</strong> betyder fyra slag i varje <strong>takt</strong>. Takterna skiljs åt av lodräta <strong>taktstreck</strong>. Den lilla röda siffran är taktens nummer.</li><li><strong>Helnot</strong>: håll tonen i fyra slag. <strong>Halvnot</strong>: två slag. <strong>Fjärdedel</strong>: ett slag.</li><li><strong>Åttondelar</strong>: två toner på varje slag. De sitter ofta ihop med ett streck, en balk. Räkna \"1 och 2 och 3 och 4 och\".</li><li><strong>Trioler</strong>: tre toner på varje slag, markerade med en 3:a. Räkna \"tri-o-la, tri-o-la\".</li><li>En <strong>paus</strong> betyder att du är tyst så länge pausen varar.</li></ul>", "exempel": {"typ": "tex", "tex": "\\tempo 80\n\\track \"Elbas\" { instrument 33 }\n\\staff {score tabs}\n\\tuning (G2 D2 A1 E1)\n\\clef F4 \\ks Bb 3.4.1 {txt \"hel\"} |\n3.4.2 {txt \"halv\"} 3.4.2 |\n3.4.4 {txt \"fjärdedel\"} 3.4.4 3.4.4 3.4.4 |\n3.4.8 {txt \"åttondelar\"} 3.4.8 3.4.8 3.4.8 3.4.8 3.4.8 3.4.8 3.4.8 |\n3.4.8 {tu 3 txt \"trioler\"} 3.4.8 {tu 3} 3.4.8 {tu 3} 3.4.8 {tu 3} 3.4.8 {tu 3} 3.4.8 {tu 3} 3.4.8 {tu 3} 3.4.8 {tu 3} 3.4.8 {tu 3} 3.4.8 {tu 3} 3.4.8 {tu 3} 3.4.8 {tu 3} |\n3.4.4 {txt \"paus\"} r.4 r.2", "text": "Samma ton, G, med olika notvärden. Noterna står ovanför, tabben under."}}, {"id": "puls", "rubrik": "Puls, BPM och metronom", "text": "<ul><li><strong>Pulsen</strong> är de jämna slagen i musiken, de du stampar takten till.</li><li><strong>BPM</strong> betyder <em>beats per minute</em>, slag per minut. <strong>♩ = 60</strong> betyder 60 slag per minut, alltså ett slag i sekunden. Högre tal går snabbare.</li><li>En <strong>metronom</strong> klickar på varje slag, så att du håller tempot jämnt. Första slaget i varje takt låter lite annorlunda.</li><li>Att spela <strong>jämnt</strong> i ett lugnt tempo är viktigare än att spela fort.</li></ul>", "exempel": {"typ": "metronom", "text": "Prova att lyssna på några olika tempon. Klappa eller räkna med."}}, {"id": "kortet", "rubrik": "Kortets delar", "text": "<p>Alla kort ser likadana ut. Uppifrån och ned:</p><ul><li><strong>Nummer, namn och block</strong> högst upp.</li><li><strong>Cellen</strong> är övningens grundidé, i siffror och som första takten i noter. Siffrorna är tonerna i boxen räknat nedifrån: 1 är lägsta tonen. \"1 2 3 4 · 2 3 4 5\" betyder fyra toner uppåt, och sedan fyra toner uppåt igen men med start en ton högre. Förstår du cellen har du förstått övningen.</li><li><strong>Greppbild</strong>: var på halsen du spelar.</li><li><strong>Hela övningen</strong> i noter och tabb.</li><li><strong>Mål</strong>: vad du ska tänka på.</li><li><strong>Så gör du</strong>: hur du spelar övningen, steg för steg.</li><li><strong>Variationer</strong> (V1, V2, V3): nya sätt att spela samma övning när den sitter.</li><li><strong>Tempotrappan</strong>: börja på det lägsta tempot. Kryssa i rutan när du kan spela kortet <strong>tre gånger i rad utan att stanna</strong>. Gå sedan upp ett steg.</li><li><strong>Klar-knappen</strong>: tryck när övningen sitter. Kortet får en bock i menyn, och du kan gå vidare till nästa kort.</li></ul>"}, {"id": "spelaren", "rubrik": "Spelaren", "text": "<p>Längst ned på varje kort finns spelaren. Med den kan du lyssna på övningen och spela med.</p><ul><li><strong>▶</strong> spelar och pausar. Du kan också trycka på mellanslag. <strong>■</strong> stoppar och går tillbaka till början.</li><li><strong>− och +</strong> ändrar tempot fem slag i taget. Siffrorna bredvid är tempotrappans steg.</li><li><strong>Metronom</strong> slår på och av klicket.</li><li><strong>Inräkning</strong> ger en takt med klick innan musiken börjar, så att du hinner göra dig redo.</li><li><strong>Loop</strong> spelar övningen om och om igen.</li><li><strong>Komp</strong> väljer vad som spelar med dig. <strong>Groove</strong> är trummor och ackord, och du är basisten. <strong>Bordun</strong> är en låg ton (G och D) som ligger kvar och klingar, så att du hör tonarten. <strong>Av</strong> är bara du och metronomen.</li><li>Klicka på en not i övningen för att börja spela därifrån. Den färgade markören visar var du är.</li><li>Första gången du trycker ▶ kan ljudet behöva några sekunder för att laddas.</li></ul>"}, {"id": "utskrift", "rubrik": "Skriva ut", "text": "<p>Knappen <strong>Skriv ut</strong> i spelaren ger kortet på ett A4. Bockar och uppspelning finns bara på skärmen, så kryssa i tempotrappan med penna på papperet.</p>"}, {"id": "ova", "rubrik": "Så övar du", "text": "<ul><li><strong>Några minuter varje dag</strong> är bättre än en lång stund en gång i veckan.</li><li><strong>Långsamt först.</strong> Spela rätt innan du spelar fort.</li><li><strong>Spela med metronomen.</strong> Öka tempot ett steg i taget.</li><li><strong>Håll handen avslappnad.</strong> Gör det ont eller känns spänt: ta en paus.</li><li>Lyssna på dig själv. Låter tonerna jämnt och rent?</li></ul>"}]};
const AT = 'lib/alphatab/';
const GRUNDTEMPO = 80; // \tempo i alla övningar; spelhastigheten räknas om från detta
const $ = s => document.querySelector(s);
const INST = DATA.instrument;

const store = {
  get(k, d) { try { const v = localStorage.getItem('tk:' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('tk:' + k, JSON.stringify(v)); } catch (e) {} },
};

const kort = DATA.kort;
const blockkod = k => /^[A-F]\./.test(k.block) ? k.block[0] : '0';
const byId = Object.fromEntries(kort.map(k => [k.id, k]));
const opts = Object.assign({ metronom: true, inrakning: false, loop: true, komp: 'groove', diag: 'ro' }, store.get('opts', {}));
if (!['av', 'bordun', 'groove'].includes(opts.komp)) opts.komp = 'groove';
delete opts.bordun;
// kompspåren ligger i varje övning men ritas inte; valet avgör vilka som tystas
const KOMPSPAR = { av: [], bordun: ['Bordun'], groove: ['Trummor', 'Kompbas', 'Ackord'] };
const ALLA_KOMP = ['Bordun', 'Trummor', 'Kompbas', 'Ackord'];
const tyst = namn => ALLA_KOMP.includes(namn) && !KOMPSPAR[opts.komp].includes(namn);
const texMedKomp = tex => tex.replace(/\\track "([^"]+)" \{ ([^}]*?) ?\}/g,
  (m, namn, egenskaper) => tyst(namn) ? `\\track "${namn}" { ${egenskaper} mute }` : m);
let current = null, bpm = 60, ready = false, playing = false, tillToppen = false;
history.scrollRestoration = 'manual';

/* ---------- alphaTab ---------- */
const NE = alphaTab.NotationElement;
const dolda = () => new Map([[NE.EffectDynamics, false], [NE.GuitarTuning, false], [NE.TrackNames, false], [NE.EffectTempo, false]]);
const smal = () => window.innerWidth < 600;

const main = new alphaTab.AlphaTabApi($('#main-at'), {
  core: { fontDirectory: AT + 'font/', enableLazyLoading: false },
  notation: { elements: dolda() },
  display: { scale: smal() ? 0.8 : 1 },
  player: { enablePlayer: true, enableCursor: true, enableUserInteraction: true, soundFont: AT + 'soundfont/sonivox.sf2', scrollMode: alphaTab.ScrollMode.Off, scrollOffsetY: -120 },
});
const cell = new alphaTab.AlphaTabApi($('#cell-at'), {
  core: { fontDirectory: AT + 'font/', enableLazyLoading: false },
  notation: { elements: dolda() },
  display: { scale: 0.8 },
  player: { enablePlayer: false, scrollMode: alphaTab.ScrollMode.Off },
});

main.soundFontLoad.on(e => { if (e.total) status(`Laddar ljud … ${Math.round(e.loaded / e.total * 100)} %`); });
main.playerReady.on(() => { ready = true; status('Redo – tryck ▶ (eller mellanslag)'); updatePlay(); applyOpts(); });
main.playerStateChanged.on(e => {
  playing = e.state === 1;
  // följ markören bara under uppspelning, annars hoppar sidan när ett kort laddas
  main.settings.player.scrollMode = playing ? alphaTab.ScrollMode.Continuous : alphaTab.ScrollMode.Off;
  main.updateSettings();
  updatePlay();
});
main.scoreLoaded.on(() => applyOpts());
// nytt kort ska alltid börja högst upp, även om alphaTab flyttar sidan medan noterna ritas
main.postRenderFinished.on(() => {
  if (!tillToppen) return;
  tillToppen = false;
  requestAnimationFrame(() => window.scrollTo(0, 0));
});
main.error.on(e => status('Något gick fel: ' + (e && e.message ? e.message : e)));

function status(t) { $('#status').textContent = t; }
function updatePlay() {
  const b = $('#play');
  b.disabled = !ready;
  b.textContent = playing ? '❚❚' : '▶';
  b.setAttribute('aria-label', playing ? 'Pausa' : 'Spela');
}

function applyOpts() {
  main.metronomeVolume = opts.metronom ? 1 : 0;
  main.countInVolume = opts.inrakning ? 1 : 0;
  main.isLooping = opts.loop;
  main.playbackSpeed = bpm / GRUNDTEMPO;
  if (main.score) {
    for (const t of main.score.tracks) {
      if (ALLA_KOMP.includes(t.name)) { try { main.changeTrackMute([t], tyst(t.name)); } catch (e) {} }
    }
  }
  document.querySelectorAll('.tog').forEach(b => b.setAttribute('aria-pressed', String(!!opts[b.dataset.opt])));
  document.querySelectorAll('.kval').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.komp === opts.komp)));
}

/* ---------- navigering ---------- */
function buildNav() {
  const andra = INST === 'gitarr' ? ['bas', 'Elbas'] : ['gitarr', 'Gitarr'];
  $('#inst-switch').innerHTML = INST === 'gitarr'
    ? `<a class="on">Gitarr</a><a href="bas.html">Elbas</a>`
    : `<a href="gitarr.html">Gitarr</a><a class="on">Elbas</a>`;
  $('#inst-switch').querySelectorAll('a[href]').forEach(a => a.addEventListener('click', () => { a.href = andra[0] + '.html' + location.hash; }));

  // hopfällda kapitel/block sparas per instrument; nycklar som "k1" och "k1|A. Box 1 på djupet"
  const stangda = new Set(store.get(INST + ':stangda', []));
  const oppen = nyckel => stangda.has(nyckel) ? '' : ' open';
  let nav = `<div class="nav-verktyg"><button data-alla="stang">Fäll ihop alla</button><button data-alla="oppna">Fäll ut alla</button></div>`
    + `<a href="#start" data-id="start" class="nav-item nav-start"><span class="nid">★</span><span class="nt">Start här: så funkar korten</span><span class="prog"></span></a>`;
  let sel = `<option value="start">★ Start här: så funkar korten</option>`;
  for (const [kn, kap] of Object.entries(DATA.kapitel)) {
    nav += `<details class="nav-kap" data-nyckel="k${kn}"${oppen('k' + kn)}><summary><h3><span>Kapitel ${kn}<em class="raknare" data-rakna="k${kn}"></em></span>${kap.titel}</h3></summary><p>${kap.intro}</p>`;
    sel += `<optgroup label="Kapitel ${kn} · ${kap.titel}">`;
    let block = null;
    for (const k of kort.filter(k => String(k.kap) === kn)) {
      if (k.block !== block) {
        if (block !== null) nav += '</details>';
        block = k.block;
        const nyckel = `k${kn}|${block}`;
        nav += `<details class="nav-blk" data-nyckel="${nyckel}"${oppen(nyckel)}><summary><h4 class="b${blockkod(k)}">${block}<span class="raknare" data-rakna="${nyckel}"></span></h4></summary>`;
      }
      nav += `<a href="#${k.id}" data-id="${k.id}" class="nav-item"><span class="nid">${k.id}</span><span class="nt">${k.titel}</span><span class="prog" data-prog="${k.id}"></span></a>`;
      sel += `<option value="${k.id}">${k.id}  ${k.titel}</option>`;
    }
    if (block !== null) nav += '</details>';
    nav += '</details>'; sel += '</optgroup>';
  }
  $('#nav').innerHTML = nav;
  const sparaStangda = () => store.set(INST + ':stangda',
    [...document.querySelectorAll('#nav details:not([open])')].map(d => d.dataset.nyckel));
  document.querySelectorAll('#nav details').forEach(d => d.addEventListener('toggle', sparaStangda));
  document.querySelectorAll('.nav-verktyg button').forEach(b => b.onclick = () => {
    const stang = b.dataset.alla === 'stang';
    document.querySelectorAll('#nav details').forEach(d => {
      // vid "fäll ihop alla" hålls blocken öppna inuti, så att ett utfällt kapitel visar sina kort
      if (d.classList.contains('nav-kap')) d.open = !stang; else d.open = true;
    });
  });
  $('#kortval').innerHTML = sel;
  $('#kortval').onchange = e => { location.hash = e.target.value; };
  kort.forEach(updateProg);
  updateRaknare();
}

function klar(k, t) { return store.get(`${INST}:${k.id}:${t}`, false); }
function arKlar(k) { return store.get(`${INST}:klar:${k.id}`, false); }
function updateProg(k) {
  const el = document.querySelector(`[data-prog="${k.id}"]`);
  if (el) el.innerHTML = arKlar(k) ? '<span class="bock" title="Klar">✓</span>'
    : k.tempo.some(t => klar(k, t)) ? k.tempo.map(t => klar(k, t) ? '●' : '○').join('') : '';
  const a = document.querySelector(`.nav-item[data-id="${k.id}"]`);
  if (a) a.classList.toggle('klar', arKlar(k));
  const o = [...$('#kortval').options].find(o => o.value === k.id);
  if (o) o.textContent = `${arKlar(k) ? '✓ ' : ''}${k.id}  ${k.titel}`;
}
// räknare (3/5) i kapitel- och blockrubrikerna; grönt när allt är klart
const iGrupp = (k, nyckel) => nyckel.includes('|') ? `k${k.kap}|${k.block}` === nyckel : `k${k.kap}` === nyckel;
function updateRaknare() {
  document.querySelectorAll('[data-rakna]').forEach(el => {
    const grupp = kort.filter(k => iGrupp(k, el.dataset.rakna));
    const n = grupp.filter(arKlar).length, allt = n === grupp.length;
    el.textContent = `${allt ? '✓ ' : ''}${n}/${grupp.length}`;
    el.classList.toggle('allt', allt);
    el.closest('h3, h4').classList.toggle('allt-klart', allt);
  });
}

/* ---------- klar-knappen ---------- */
function renderKlar() {
  const k = current, ar = arKlar(k), b = $('#klarknapp');
  const helaKapitlet = kort.filter(x => x.kap === k.kap).every(arKlar);
  b.classList.toggle('klar', ar);
  b.setAttribute('aria-pressed', String(ar));
  $('#klar-rubrik').textContent = !ar ? `Klar med ${k.id}?` : helaKapitlet ? `Hela kapitel ${k.kap} klart!` : 'Klart! Snyggt jobbat.';
  $('#klar-under').textContent = ar ? 'Kortet är avbockat. Tryck igen för att ångra.' : 'Tryck här när övningen sitter.';
  const next = kort[kort.indexOf(k) + 1];
  $('#klar-nasta').hidden = !(ar && next);
  if (next) $('#klar-nasta').href = '#' + next.id;
  $('#k-klarchip').hidden = !ar;
}
function firaKlart() {
  const b = $('#klarknapp');
  b.classList.remove('pop'); void b.offsetWidth; b.classList.add('pop');
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cirkel = b.querySelector('.klar-cirkel');
  const farger = ['#3d7a4b', '#b0502a', '#e9a07f', '#5f7a3a', '#8a6a1f', '#4b6a78', '#7a4b6e'];
  for (let i = 0; i < 16; i++) {
    const bit = document.createElement('span'), v = i / 16 * Math.PI * 2, r = 42 + Math.random() * 34;
    bit.className = 'konfetti';
    bit.style.cssText = `--dx:${Math.cos(v) * r}px;--dy:${Math.sin(v) * r}px;--rot:${Math.random() * 360}deg;background:${farger[i % farger.length]}`;
    cirkel.appendChild(bit);
    setTimeout(() => bit.remove(), 800);
  }
}
$('#klarknapp').onclick = () => {
  const ny = !arKlar(current);
  store.set(`${INST}:klar:${current.id}`, ny);
  renderKlar(); updateProg(current); updateRaknare();
  if (ny) firaKlart();
};

/* ---------- vilket läge: kort eller genomgång ---------- */
function visa(id) {
  // okänd eller tom adress: där man var senast, annars genomgången (förstagångsbesökare)
  const mal = byId[id] || id === 'start' ? id : store.get(INST + ':senast', 'start');
  if (byId[mal]) showCard(mal); else showGuide();
}
function markeraMeny(id) {
  document.querySelectorAll('.nav-item').forEach(a => a.classList.toggle('aktiv', a.dataset.id === id));
  const aktiv = document.querySelector('.nav-item.aktiv'), sb = $('#nav');
  for (let d = aktiv && aktiv.parentElement; d && d !== sb; d = d.parentElement) if (d.tagName === 'DETAILS') d.open = true;
  if (aktiv && (aktiv.offsetTop < sb.scrollTop || aktiv.offsetTop > sb.scrollTop + sb.clientHeight - 40)) sb.scrollTop = aktiv.offsetTop - sb.clientHeight / 3;
  $('#kortval').value = id;
}

/* ---------- kortet ---------- */
function showCard(id) {
  const k = byId[id] || byId[store.get(INST + ':senast', '')] || kort[0];
  stoppaMetronom();
  document.body.classList.remove('guidelage');
  $('#guide').hidden = true;
  $('#kortvy').hidden = false;
  current = k;
  store.set(INST + ':senast', k.id);
  document.title = `${k.id} ${k.titel} · Teknikkort ${DATA.titel}`;

  $('#k-id').textContent = k.id;
  $('#k-titel').textContent = k.titel;
  $('#k-kap').textContent = `${DATA.titel} · Kapitel ${k.kap} · ${DATA.kapitel[k.kap].titel}`;
  const blk = $('#k-block'); blk.textContent = k.block; blk.className = 'badge b' + blockkod(k);
  $('#k-formel').textContent = k.formel;
  $('#k-formel-p').textContent = k.formel;
  $('#k-mal').textContent = k.mal;
  $('#k-gor').textContent = k.gor;
  $('#k-var').innerHTML = k.variationer.map(v => `<li>${v}</li>`).join('');

  $('#k-trappa').innerHTML = k.tempo.map(t =>
    `<label class="${klar(k, t) ? 'klar' : ''}"><input type="checkbox" data-t="${t}" ${klar(k, t) ? 'checked' : ''}> ♩ ${t}</label>`).join('');
  $('#k-trappa').querySelectorAll('input').forEach(inp => inp.onchange = () => {
    store.set(`${INST}:${k.id}:${inp.dataset.t}`, inp.checked);
    inp.parentElement.classList.toggle('klar', inp.checked);
    updateProg(k);
  });

  const i = kort.indexOf(k), prev = kort[i - 1], next = kort[i + 1];
  $('#prev').hidden = !prev; if (prev) { $('#prev').href = '#' + prev.id; $('#prev').textContent = `← ${prev.id} ${prev.titel}`; }
  $('#next').hidden = !next; if (next) { $('#next').href = '#' + next.id; $('#next').textContent = `${next.id} ${next.titel} →`; }

  markeraMeny(k.id);

  renderKlar();
  renderDiagram();
  bpm = k.tempo[0];
  renderTempo();

  main.stop();
  const tex = texMedKomp(k.tex);
  tillToppen = true;
  main.tex(tex, [0]);
  cell.tex(k.cell, [0]);
  window.scrollTo(0, 0);
}

/* ---------- tempo ---------- */
function renderTempo() {
  $('#bpm').textContent = `♩ = ${bpm}`;
  $('#chips').innerHTML = current.tempo.map(t => `<button class="chip ${t === bpm ? 'on' : ''}" data-t="${t}">${t}</button>`).join(' ');
  $('#chips').querySelectorAll('.chip').forEach(c => c.onclick = () => setBpm(+c.dataset.t));
}
function setBpm(v) {
  bpm = Math.max(30, Math.min(220, v));
  main.playbackSpeed = bpm / GRUNDTEMPO;
  renderTempo();
}

/* ---------- greppbild ---------- */
function renderDiagram() {
  const d = current.diagram;
  const mode = d.las || opts.diag;
  $('#diag-seg').style.visibility = d.las ? 'hidden' : 'visible';
  $('#diag-seg').querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.mode === mode));
  const { svg, n } = greppbildSvg(d, mode);
  $('#diagram').innerHTML = svg + (d.toner.some(t => t.ny)
    ? '<p class="diagram-not"><span class="ny-prick"></span>blå = nya toner</p>' : '');
  // breda greppbilder (t.ex. formkedjan) får en egen rad
  document.querySelector('.grid2').classList.toggle('bred', n > 8);
  $('#kortvy').classList.toggle('bred-diagram', n > 8);
}

function greppbildSvg(d, mode) {
  const harOppen = d.lo === 0;
  const start = harOppen ? 1 : d.lo;
  const slut = Math.max(d.hi, start + 3);
  const n = slut - start + 1;
  const S = d.strangar.length;
  const fw = 46, ss = 28, left = harOppen ? 62 : 34, top = 18;
  const w = left + n * fw + 14, h = top + (S - 1) * ss + 40;
  const y = s => top + (S - 1 - s) * ss;
  const x = f => f === 0 ? left - 22 : left + (f - start + 0.5) * fw;

  let g = '';
  for (let s = 0; s < S; s++) {
    g += `<line x1="${left}" y1="${y(s)}" x2="${left + n * fw}" y2="${y(s)}" stroke="#b9ae9c" stroke-width="${1 + (S - 1 - s) * 0.3}"/>`;
    g += `<text x="${harOppen ? left - 44 : left - 16}" y="${y(s) + 4}" font-size="12" fill="#6f675c" text-anchor="middle" font-weight="600">${d.strangar[s]}</text>`;
  }
  for (let k = 0; k <= n; k++) {
    const nut = harOppen && k === 0;
    g += `<line x1="${left + k * fw}" y1="${top - 6}" x2="${left + k * fw}" y2="${y(0) + 6}" stroke="${nut ? '#1f1c18' : '#d6ccbc'}" stroke-width="${nut ? 5 : 1.5}"/>`;
  }
  for (let f = start; f <= slut; f++) {
    const markerad = [3, 5, 7, 9, 12, 15, 17].includes(f);
    g += `<text x="${x(f)}" y="${y(0) + 26}" font-size="12" text-anchor="middle" fill="${markerad ? '#1f1c18' : '#a39a8c'}" font-weight="${markerad ? 700 : 500}">${f}</text>`;
  }
  for (const t of d.toner) {
    const label = mode === 'ro' ? (t.rot ? 'R' : '') : mode === 'iv' ? t.iv : t.namn;
    const cx = x(t.f), cy = y(t.s);
    const fill = t.rot ? 'var(--accent)' : t.ny ? 'var(--ny)' : (t.f === 0 ? '#fff' : '#1f1c18');
    const stroke = t.f === 0 && !t.rot ? '#1f1c18' : 'none';
    const textFill = t.f === 0 && !t.rot ? '#1f1c18' : '#fff';
    g += `<circle cx="${cx}" cy="${cy}" r="11.5" fill="${fill}" stroke="${stroke}" stroke-width="2"/>`;
    if (label) g += `<text x="${cx}" y="${cy + 4}" font-size="${label.length > 2 ? 9.5 : 11.5}" text-anchor="middle" fill="${textFill}" font-weight="700">${label}</text>`;
  }
  const svg = `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="Greppbild" style="max-width:${w * 1.15}px;font-family:Inter,system-ui,sans-serif">${g}</svg>`;
  return { svg, n };
}

/* ---------- start här: genomgång av allt på sidan ---------- */
let guideByggd = false, metroCtx = null, metro = null;
function showGuide() {
  main.stop();
  document.body.classList.add('guidelage');
  $('#kortvy').hidden = true;
  $('#guide').hidden = false;
  store.set(INST + ':senast', 'start');
  document.title = `Start här · Teknikkort ${DATA.titel}`;
  markeraMeny('start');
  if (!guideByggd) { byggGuide(); guideByggd = true; }
  window.scrollTo(0, 0);
}
function byggGuide() {
  const sek = DATA.start, forstaOvning = kort.find(k => k.kap === 1) || kort[0];
  $('#guide').innerHTML = `
    <div class="kort-head">
      <div class="kort-id start-id">Start</div>
      <div><div class="kap">${DATA.titel} · Innan du börjar</div><h1>Så funkar korten</h1></div>
      <span class="utskrift-adress">${DATA.doman || ''}</span>
    </div>
    <nav class="guide-toc">${sek.map(s => `<button data-mal="g-${s.id}">${s.rubrik}</button>`).join('')}</nav>
    ${sek.map((s, i) => `<section class="panel guide-sek" id="g-${s.id}">
      <h2 class="guide-rubrik"><span>${i + 1}</span>${s.rubrik}</h2>
      <div class="guide-text">${s.text}</div>
      ${s.exempel ? `<figure class="guide-ex" data-ex="${i}"><div class="guide-ex-yta"></div><figcaption>${s.exempel.text}</figcaption></figure>` : ''}
    </section>`).join('')}
    <div class="guide-start">
      <a class="klar-nasta" href="#${kort[0].id}">Aldrig spelat? Börja på ${kort[0].id} →</a>
      <a class="klar-nasta alt" href="#${forstaOvning.id}">Spelat lite? Börja på ${forstaOvning.id} →</a>
    </div>
    ${DATA.donation ? `<div class="donation"><span class="donation-ikon"><svg viewBox="0 0 24 24" width="34" height="34" aria-hidden="true"><path fill="currentColor" d="M12 22.5C8 18.5 2.5 12.5 2.5 7.6 2.5 4.3 6.7 2 12 2s9.5 2.3 9.5 5.6c0 4.9-5.5 10.9-9.5 14.9z"/><path fill="#e5484d" d="M12 14.6c-2.6-2-4.3-3.5-4.3-5.3 0-1.3 1-2.3 2.2-2.3.9 0 1.6.5 2.1 1.3.5-.8 1.2-1.3 2.1-1.3 1.2 0 2.2 1 2.2 2.3 0 1.8-1.7 3.3-4.3 5.3z"/></svg></span>
      <span class="donation-text">Gillar du korten? Bjud mig gärna på ett paket strängar eller plektrum, så fortsätter jag göra fler kapitel.</span>
      <a class="donation-knapp" href="${DATA.donation.url}" target="_blank" rel="noopener noreferrer"
         referrerpolicy="no-referrer">Bjud mig på strängar →</a></div>` : ''}`;
  $('#guide').querySelectorAll('.guide-toc button').forEach(b => b.onclick = () =>
    document.getElementById(b.dataset.mal).scrollIntoView({ behavior: 'smooth', block: 'start' }));
  $('#guide').querySelectorAll('.guide-ex').forEach(fig => {
    const ex = sek[+fig.dataset.ex].exempel, yta = fig.querySelector('.guide-ex-yta');
    if (ex.typ === 'diagram') guideGreppbild(yta, ex.diagram, 'ro');
    else if (ex.typ === 'metronom') metronomWidget(yta);
    else if (ex.typ === 'tex') new alphaTab.AlphaTabApi(yta, {
      core: { fontDirectory: AT + 'font/', enableLazyLoading: false },
      notation: { elements: dolda() },
      display: { scale: smal() ? 0.8 : 0.95 },
      player: { enablePlayer: false, scrollMode: alphaTab.ScrollMode.Off },
    }).tex(ex.tex, [0]);
  });
}
function guideGreppbild(yta, d, mode) {
  yta.innerHTML = `<div class="diagram-head"><div class="seg">${[['ro', 'R / o'], ['iv', 'Intervaller'], ['namn', 'Tonnamn']]
    .map(([m, t]) => `<button data-mode="${m}" class="${m === mode ? 'on' : ''}">${t}</button>`).join('')}</div></div>${greppbildSvg(d, mode).svg}`;
  yta.querySelectorAll('.seg button').forEach(b => b.onclick = () => guideGreppbild(yta, d, b.dataset.mode));
}

/* ---------- metronom att prova i genomgången ---------- */
function metronomWidget(yta) {
  yta.innerHTML = `<div class="metro">
    <div class="metro-slag">${[1, 2, 3, 4].map(n => `<span>${n}</span>`).join('')}</div>
    <div class="metro-knappar">${[60, 90, 120].map(b => `<button class="metro-knapp" data-bpm="${b}">♩ = ${b}</button>`).join('')}
      <button class="metro-knapp" data-bpm="0">■ Stopp</button></div>
  </div>`;
  yta.querySelectorAll('.metro-knapp').forEach(b => b.onclick = () => {
    stoppaMetronom();
    if (+b.dataset.bpm) startaMetronom(+b.dataset.bpm, yta);
  });
}
function startaMetronom(tempo, yta) {
  metroCtx = metroCtx || new (window.AudioContext || window.webkitAudioContext)();
  metroCtx.resume();
  const ctx = metroCtx, prickar = yta.querySelectorAll('.metro-slag span'), knappar = yta.querySelectorAll('.metro-knapp');
  knappar.forEach(k => k.classList.toggle('on', +k.dataset.bpm === tempo));
  const denna = { prickar, knappar };
  let slag = 0, nasta = ctx.currentTime + 0.1;
  const schemalagg = () => {
    while (nasta < ctx.currentTime + 0.15) {
      const osc = ctx.createOscillator(), gain = ctx.createGain(), nr = slag % 4;
      osc.frequency.value = nr === 0 ? 1600 : 1000;
      gain.gain.setValueAtTime(0.0001, nasta);
      gain.gain.exponentialRampToValueAtTime(0.4, nasta + 0.002);
      gain.gain.exponentialRampToValueAtTime(0.0001, nasta + 0.06);
      osc.connect(gain).connect(ctx.destination);
      osc.start(nasta); osc.stop(nasta + 0.07);
      setTimeout(() => { if (metro === denna) prickar.forEach((p, i) => p.classList.toggle('on', i === nr)); },
        Math.max(0, (nasta - ctx.currentTime) * 1000));
      nasta += 60 / tempo; slag++;
    }
  };
  schemalagg();
  denna.timer = setInterval(schemalagg, 25);
  metro = denna;
}
function stoppaMetronom() {
  if (!metro) return;
  clearInterval(metro.timer);
  metro.prickar.forEach(p => p.classList.remove('on'));
  metro.knappar.forEach(k => k.classList.remove('on'));
  metro = null;
}

document.addEventListener('keydown', e => {
  if (e.code === 'Space' && !/INPUT|SELECT|TEXTAREA|BUTTON/.test(e.target.tagName) && ready && !document.body.classList.contains('guidelage')) { e.preventDefault(); main.playPause(); }
});
// Skriv ut-knappen: lägg kortet i papperslayouten, rita om övningen i A4-bredd och prova allt
// mindre noter (fler takter per rad) tills hela kortet ryms på en A4. Skriv sedan ut och återställ.
// Ctrl+P går också (papperslayouten sätts i beforeprint), men utan anpassningen.
const PAPPER_BREDD = 718;  // A4 210 mm minus 2 × 10 mm marginal, i CSS-pixlar
const PAPPER_HOJD = 1035;  // A4 297 mm minus marginaler (≈ 1047 px) och lite luft
function vantaPaRitning(api) {
  return new Promise(klar => {
    const h = () => { api.postRenderFinished.off(h); klar(); };
    api.postRenderFinished.on(h);
  });
}
async function ritaFor(api, radlangd, skala) {
  api.settings.display.barsPerRow = radlangd;
  api.settings.display.scale = skala;
  api.updateSettings();
  const ritad = vantaPaRitning(api);
  api.render();
  await ritad;
}
let utskriftForberedd = false;
async function skrivUt() {
  if (document.body.classList.contains('guidelage')) return window.print();
  const el = $('#main-at');
  main.stop();
  status('Förbereder utskrift …');
  utskriftForberedd = true;
  document.body.classList.add('pappersvy');
  el.style.width = (PAPPER_BREDD - 22) + 'px';
  const tatast = Math.max(...main.score.tracks[0].staves[0].bars.map(b => b.voices[0].beats.length));
  const forsok = tatast > 8
    ? [[3, 0.72], [3, 0.64], [4, 0.6], [4, 0.54], [5, 0.5], [6, 0.46]]
    : [[4, 0.72], [4, 0.64], [5, 0.6], [6, 0.56], [6, 0.5], [8, 0.46]];
  for (const [radlangd, skala] of forsok) {
    await ritaFor(main, radlangd, skala);
    if ($('#kortvy').offsetHeight <= PAPPER_HOJD) break;
  }
  window.print();
  document.body.classList.remove('pappersvy');
  utskriftForberedd = false;
  el.style.width = '';
  await ritaFor(main, -1, smal() ? 0.8 : 1);
  status(ready ? 'Redo – tryck ▶ (eller mellanslag)' : 'Laddar …');
}

// Ctrl+P utan knappen: papperslayout, och skala ned skärmversionen av noterna så att de ryms
function anpassa(sel, w) { const el = $(sel); el.style.zoom = el.scrollWidth > w ? (w / el.scrollWidth).toFixed(3) : ''; }
window.addEventListener('beforeprint', () => {
  if (utskriftForberedd) return;
  document.body.classList.add('pappersvy');
  anpassa('#main-at', PAPPER_BREDD - 22);
});
window.addEventListener('afterprint', () => {
  if (utskriftForberedd) return;
  document.body.classList.remove('pappersvy');
  $('#main-at').style.zoom = '';
});
window.addEventListener('hashchange', () => visa(decodeURIComponent(location.hash.slice(1))));

// stöd-länken uppe till höger, bara på den publika varianten (där donation är satt)
if (DATA.donation) { $('#stod').href = DATA.donation.url; $('#stod').hidden = false; }

// sidans adress i toppen och på utskrifter, bara när domänen är inställd
if (DATA.doman) {
  document.querySelectorAll('.doman, .utskrift-adress').forEach(el => { el.textContent = DATA.doman; el.hidden = false; });
  document.body.classList.add('har-doman');
}

buildNav();
visa(decodeURIComponent(location.hash.slice(1)));
</script>
