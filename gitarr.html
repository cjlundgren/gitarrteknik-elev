<style>
@font-face { font-family: "Fraunces"; src: url("lib/fonts/fraunces.woff2") format("woff2"); font-weight: 500 700; font-display: swap; }
@font-face { font-family: "Inter"; src: url("lib/fonts/inter.woff2") format("woff2"); font-weight: 400 700; font-display: swap; }
:root, body.pappersvy {
  color-scheme: light;
  --paper: #f7f3ec;
  --card: #ffffff;
  --ink: #1f1c18;
  --muted: #6f675c;
  --line: #e4dccf;
  --line-strong: #cfc5b5;
  --hover: #ece5d9;
  --strong: #1f1c18; /* mörka knappar och markeringar med vit text */
  --accent: #b0502a;
  --accent-ink: #ffffff;
  --accent-soft: #f5e4da;
  /* en färg per block: 0 = förberedelse, A–D = kapitlets block */
  --b0: #8a6a1f; --b0-soft: #f3ead2;
  --bA: #b0502a; --bA-soft: #f5e4da;
  --bB: #4b6a78; --bB-soft: #e1ebef;
  --bC: #5f7a3a; --bC-soft: #e6eedb;
  --bD: #7a4b6e; --bD-soft: #f0e3ec;
  --bE: #2f6f73; --bE-soft: #dcecec;
  --bF: #55558a; --bF-soft: #e5e5f2;
  --ok: #3d7a4b;
  --ok-soft: #eaf3ec;
  --ny: #2f68a8; /* nya toner i greppbilden (t.ex. mollskalans 2:a och ♭6) */
  /* greppbilden */
  --g-strang: #b9ae9c; --g-band: #d6ccbc; --g-bandnr: #a39a8c;
  /* toppen och spelaren (mörka i båda lägena) */
  --bar: #1f1c18; --bar-genom: rgba(31, 28, 24, .96);
  --bar-2: #3a352e; --bar-3: #4a443b; --bar-linje: #5a5248;
  --bar-text: #f7f3ec; --bar-dov: #bfb5a6; --bar-dovare: #8f8576; --bar-chip: #d9d0c2; --bar-inst: #cfc6b8;
}
/* mörkt läge: neutralt grått (inte brunt), samma accent och blockfärger men ljusare så att de syns */
:root.mork {
  color-scheme: dark;
  --paper: #16171a;
  --card: #202226;
  --ink: #ebe7e0;
  --muted: #a49e94;
  --line: #33363c;
  --line-strong: #4b4f57;
  --hover: #2a2d32;
  --strong: #464a52;
  --accent: #c8623a;
  --accent-ink: #ffffff;
  --accent-soft: #3a2820;
  --b0: #d4ad55; --b0-soft: #322a19;
  --bA: #e48c64; --bA-soft: #3a2820;
  --bB: #8fb6c8; --bB-soft: #1d2b32;
  --bC: #a2c47a; --bC-soft: #232f1a;
  --bD: #cd9bbf; --bD-soft: #33222f;
  --bE: #72c0c3; --bE-soft: #183031;
  --bF: #a9a9e0; --bF-soft: #25253a;
  --ok: #4f9a62;
  --ok-soft: #1c2f22;
  --ny: #5b9be0;
  --g-strang: #6d7078; --g-band: #3d4047; --g-bandnr: #7d8088;
  --bar: #0d0e10; --bar-genom: rgba(13, 14, 16, .96);
  --bar-2: #2a2d32; --bar-3: #363940; --bar-linje: #454850;
  --bar-text: #ebe7e0; --bar-dov: #a7a39b; --bar-dovare: #7d7a74; --bar-chip: #cfcac2; --bar-inst: #bdb8b0;
}
:root {
  --radius: 14px;
  --serif: "Fraunces", Georgia, serif;
  --sans: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
}
/* snabba tryck (metronom, tempo, spelaren) ska inte tolkas som dubbeltryck-zoom på mobilen;
   zoom med två fingrar fungerar som vanligt */
* { box-sizing: border-box; touch-action: manipulation; }
html, body { margin: 0; }
body { background: var(--paper); color: var(--ink); font: 15px/1.55 var(--sans); }
a { color: inherit; }
button { font: inherit; color: inherit; }

/* ---------- toppen ---------- */
.topbar {
  position: sticky; top: 0; z-index: 2100;
  display: flex; align-items: center; gap: 16px;
  padding: 10px 20px; background: var(--bar); color: var(--bar-text);
}
.brand { text-decoration: none; color: inherit; font-family: var(--serif); font-weight: 700; font-size: 19px; letter-spacing: .2px; white-space: nowrap; }
.brand span { color: #e9a07f; }
.doman { font-size: 12.5px; font-weight: 600; color: var(--bar-dov); letter-spacing: .02em; white-space: nowrap; }
.doman[hidden], .utskrift-adress { display: none; }
.inst-switch { display: flex; background: var(--bar-2); border-radius: 999px; padding: 3px; }
.inst-switch a { text-decoration: none; padding: 4px 12px; border-radius: 999px; font-size: 13px; font-weight: 600; color: var(--bar-inst); }
.inst-switch a.on { background: var(--bar-text); color: #1f1c18; }
.topbar .spacer { flex: 1; }
.stod { display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border-radius: 999px;
  color: var(--bar-dov); font-size: 13px; font-weight: 600; text-decoration: none; white-space: nowrap; }
.stod:hover { color: #e9a07f; background: var(--bar-2); }
.stod[hidden] { display: none; }
.tema { flex: none; display: inline-grid; place-items: center; width: 34px; height: 34px; padding: 0; border: 0; border-radius: 50%; background: none; color: var(--bar-dov); cursor: pointer; }
.tema:hover { background: var(--bar-2); color: var(--bar-text); }
.tema svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
#kortval { display: none; max-width: 100%; padding: 6px 8px; border-radius: 8px; border: 0; font: inherit; font-size: 14px; }

/* ---------- layout ---------- */
.layout { display: grid; grid-template-columns: 290px minmax(0, 1fr); align-items: start; }
.sidebar {
  position: sticky; top: 52px; height: calc(100vh - 52px); overflow-y: auto;
  padding: 18px 14px 40px; border-right: 1px solid var(--line);
}
.nav-kap { margin-bottom: 18px; }
.nav-kap h3 { margin: 0; font-family: var(--serif); font-size: 17px; }
.nav-kap summary, .nav-blk summary { list-style: none; cursor: pointer; display: flex; align-items: flex-start; gap: 6px; border-radius: 8px; }
.nav-kap summary::-webkit-details-marker, .nav-blk summary::-webkit-details-marker { display: none; }
.nav-kap > summary { padding: 4px 6px; }
.nav-kap summary:hover, .nav-blk summary:hover { background: var(--hover); }
.nav-kap summary::before, .nav-blk summary::before {
  content: ""; flex: none; width: 7px; height: 7px; margin: 0 4px 0 2px;
  border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted);
  transform: rotate(-45deg); transition: transform .15s;
}
.nav-kap > summary::before { margin-top: 24px; }
.nav-blk > summary::before { margin-top: 3px; }
.nav-kap[open] > summary::before, .nav-blk[open] > summary::before { transform: rotate(45deg); }
.nav-kap > p { margin-left: 25px !important; }
.nav-blk > summary { margin: 8px 0 2px; padding: 3px 6px; }
.nav-blk > summary h4 { margin: 0; }
.nav-verktyg { display: flex; gap: 12px; margin: 0 6px 12px; font-size: 12px; }
.nav-verktyg button { border: 0; background: none; padding: 0; color: var(--muted); cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
.nav-verktyg button:hover { color: var(--ink); }
.nav-kap h3 span { display: block; font-family: var(--sans); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
.nav-kap p { margin: 2px 6px 8px; font-size: 12.5px; color: var(--muted); line-height: 1.45; }
.nav-kap h4 { margin: 0; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.nav-item { display: grid; grid-template-columns: 38px 1fr auto; align-items: center; gap: 6px; padding: 5px 6px; border-radius: 8px; text-decoration: none; font-size: 13.5px; }
.nav-item:hover { background: var(--hover); }
.nav-item.aktiv { background: var(--strong); color: #fff; }
.nav-item .nid { font-variant-numeric: tabular-nums; font-weight: 600; color: var(--muted); }
.nav-item.aktiv .nid { color: #e9a07f; }
.nav-kap h4.b0 { color: var(--b0); } .nav-kap h4.bA { color: var(--bA); } .nav-kap h4.bB { color: var(--bB); }
.nav-kap h4.bC { color: var(--bC); } .nav-kap h4.bD { color: var(--bD); }
.nav-kap h4.bE { color: var(--bE); } .nav-kap h4.bF { color: var(--bF); }
.nav-item.aktiv .nt { color: #fff; }
.prog { font-size: 9px; letter-spacing: 1px; color: var(--ok); white-space: nowrap; }
.bock { display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; background: var(--ok); color: #fff; font-size: 11px; font-weight: 700; letter-spacing: 0; }
.nav-item.klar .nid { color: var(--ok); }
.nav-item.aktiv.klar .nid { color: #9fd3ab; }
.raknare { margin-left: 6px; font-family: var(--sans); font-size: 11px; font-style: normal; font-weight: 600; letter-spacing: 0; text-transform: none; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.raknare.allt { color: var(--ok); }
.nav-kap h3.allt-klart, .nav-kap h3.allt-klart span, .nav-kap h4.allt-klart { color: var(--ok); }

main { padding: 26px 28px 0; min-width: 0; }
.kort { max-width: 1000px; margin: 0 auto; }

/* ---------- kortets huvud ---------- */
.kort-head { display: flex; align-items: center; gap: 18px; margin-bottom: 18px; }
.kort-id {
  flex: none; min-width: 74px; height: 74px; padding: 0 10px; border-radius: 16px; background: var(--accent); color: var(--accent-ink);
  display: grid; place-items: center; font-family: var(--serif); font-weight: 700; font-size: 30px; font-variant-numeric: tabular-nums;
}
.kort-head .kap { font-size: 12.5px; color: var(--muted); letter-spacing: .02em; }
.kort-head h1 { margin: 2px 0 0; font-family: var(--serif); font-weight: 700; font-size: 30px; line-height: 1.15; }
.badge { margin-left: auto; align-self: flex-start; padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
.badge.b0 { background: var(--b0-soft); color: var(--b0); }
.badge.bA { background: var(--bA-soft); color: var(--bA); }
.badge.bB { background: var(--bB-soft); color: var(--bB); }
.badge.bC { background: var(--bC-soft); color: var(--bC); }
.badge.bD { background: var(--bD-soft); color: var(--bD); }
.badge.bE { background: var(--bE-soft); color: var(--bE); }
.badge.bF { background: var(--bF-soft); color: var(--bF); }

/* ---------- paneler ---------- */
.panel { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; }
.panel h2 { margin: 0 0 8px; font-size: 11.5px; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; margin-bottom: 14px; }
.grid2.bred { grid-template-columns: 1fr; }
.grid3 { display: grid; grid-template-columns: 1fr 1.3fr 1fr; gap: 14px; margin: 14px 0; }
.formel { margin: 0 0 6px; font-family: var(--serif); font-size: 19px; line-height: 1.35; }
.panel p { margin: 0; }
.panel ul { margin: 0; padding-left: 18px; }
.panel li + li { margin-top: 4px; }
.diagram-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
.diagram-head h2 { margin: 0; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 2px; background: var(--paper); }
.seg button { border: 0; background: none; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; color: var(--muted); cursor: pointer; }
.seg button.on { background: var(--strong); color: #fff; }
#diagram svg { display: block; width: 100%; height: auto; }
.at-wrap { min-height: 60px; overflow-x: auto; }
.panel { min-width: 0; }
.status { font-size: 12.5px; color: var(--muted); }
.diagram-not { margin: 6px 0 0; font-size: 12.5px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.ny-prick { width: 11px; height: 11px; border-radius: 50%; background: var(--ny); display: inline-block; }

/* tempotrappa */
.trappa { display: flex; flex-wrap: wrap; gap: 8px; }
.trappa label { display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border: 1px solid var(--line); border-radius: 10px; font-variant-numeric: tabular-nums; font-weight: 600; cursor: pointer; background: var(--paper); }
.trappa input { accent-color: var(--ok); width: 16px; height: 16px; margin: 0; }
.trappa label.klar { border-color: var(--ok); color: var(--ok); background: var(--ok-soft); }

/* start här (genomgång) */
.guide { max-width: 1000px; margin: 0 auto; }
.guide[hidden], .kort[hidden] { display: none; }
body.guidelage .player { display: none; }
.kort-id.start-id { font-size: 20px; }
.guide-toc { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 16px; }
.guide-toc button { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 5px 12px; font-size: 13px; font-weight: 600; cursor: pointer; }
.guide-toc button:hover { border-color: var(--ink); }
.guide-sek { margin-bottom: 14px; scroll-margin-top: 70px; }
.panel h2.guide-rubrik { display: flex; align-items: center; gap: 10px; margin: 0 0 10px; font-family: var(--serif); font-size: 22px; font-weight: 700; letter-spacing: 0; text-transform: none; color: var(--ink); }
.guide-rubrik span { flex: none; display: grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; background: var(--accent); color: #fff; font-family: var(--sans); font-size: 14px; }
.guide-text { max-width: 72ch; font-size: 15.5px; }
.guide-text p { margin: 0 0 8px; }
.guide-text ul { margin: 0 0 8px; padding-left: 20px; }
.guide-text li + li { margin-top: 5px; }
.guide-ex { margin: 14px 0 0; padding: 14px; border-radius: 12px; background: var(--paper); border: 1px solid var(--line); }
.guide-ex .diagram-head { justify-content: flex-end; }
.guide-ex figcaption { margin-top: 8px; font-size: 13px; color: var(--muted); }
.guide-start { display: flex; gap: 12px; flex-wrap: wrap; margin: 20px 0 30px; }
.guide-start .klar-nasta { padding: 14px 22px; }
.guide-start .klar-nasta.alt { background: var(--strong); }
.guide-start.topp { margin: 0 0 16px; }
.guide-start.topp .klar-nasta { padding: 10px 18px; }
.donation { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; border: 1px dashed var(--line); color: var(--muted); }
.donation-ikon { flex: none; display: inline-flex; color: var(--line-strong); }
.donation-text { flex: 1; min-width: 200px; }
.donation-knapp { flex: none; padding: 8px 15px; border-radius: 999px; background: var(--accent); color: #fff; font-weight: 700; text-decoration: none; white-space: nowrap; }
.donation-knapp:hover { filter: brightness(1.12); }
.guide .kontakt { margin: 0 0 30px; font-size: 14px; color: var(--muted); }
.guide .kontakt a { color: inherit; }
.guide .donation { margin: 0 0 30px; padding: 14px 16px; border-radius: 12px; font-size: 14px; }
.metro-slag { display: flex; gap: 12px; margin-bottom: 12px; }
.metro-slag span { width: 38px; height: 38px; border-radius: 50%; border: 2px solid var(--line); background: var(--card); display: grid; place-items: center; font-weight: 700; color: var(--muted); }
.metro-slag span.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.metro-slag span:first-child.on { background: var(--strong); border-color: var(--strong); }
.metro-knappar { display: flex; gap: 8px; flex-wrap: wrap; }
.metro-knapp { border: 1px solid var(--line); background: var(--card); border-radius: 10px; padding: 7px 14px; font-weight: 700; cursor: pointer; font-variant-numeric: tabular-nums; }
.metro-knapp:hover { border-color: var(--ink); }
.metro-knapp.on { background: var(--strong); color: #fff; border-color: var(--strong); }

/* fristående metronom (#metronom) */
.kort-id.metro-id { font-size: 34px; }
.nav-item.nav-metro { margin: -8px 0 14px; }
.nav-item.nav-metro .nid { color: var(--accent); }
.mvy { display: grid; gap: 20px; justify-items: center; text-align: center; padding: 28px 20px; }
.mvy-tempo { display: flex; align-items: center; gap: 10px; }
.mvy-steg { width: 46px; height: 46px; border-radius: 50%; border: 1px solid var(--line); background: var(--card); color: var(--ink); font: inherit; font-weight: 700; font-size: 14px; cursor: pointer; font-variant-numeric: tabular-nums; }
.mvy-steg:hover { border-color: var(--ink); }
.mvy-bpm { min-width: 130px; }
.mvy-bpm strong { display: block; font-family: var(--serif); font-size: 64px; line-height: 1; font-variant-numeric: tabular-nums; }
.mvy-bpm span { color: var(--muted); font-size: 13px; }
#mvy-reglage { width: min(100%, 460px); accent-color: var(--accent); }
.mvy .metro-slag { margin: 0; justify-content: center; flex-wrap: wrap; }
.mvy-start { min-width: 200px; padding: 14px 28px; border: 0; border-radius: 999px; background: var(--accent); color: #fff; font: inherit; font-size: 18px; font-weight: 700; cursor: pointer; }
.mvy-start.on { background: var(--strong); }
.mvy-val { display: flex; gap: 14px 26px; flex-wrap: wrap; justify-content: center; align-items: flex-start; }
.mvy-val .seg button { padding: 5px 12px; font-size: 13px; }
.mvy-knacka { border: 1px dashed var(--line); background: var(--card); color: var(--ink); border-radius: 10px; padding: 9px 18px; font: inherit; font-weight: 700; cursor: pointer; }
.mvy-knacka:hover { border-color: var(--ink); }
.mvy-tips { color: var(--muted); font-size: 14px; margin: 0; max-width: 480px; }
.mvy > h2 { margin: 0; }
.stam { margin-top: 18px; }
.stam-strangar { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.stam-ton { width: 64px; height: 76px; border: 1px solid var(--line); border-radius: 14px; background: var(--card); color: var(--ink); cursor: pointer; display: grid; place-content: center; gap: 2px; font: inherit; }
.stam-ton span { font-size: 11.5px; color: var(--muted); font-weight: 600; }
.stam-ton strong { font-family: var(--serif); font-size: 28px; line-height: 1; }
.stam-ton:hover { border-color: var(--ink); }
.stam-ton[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
.stam-ton[aria-pressed="true"] span { color: #fff; }
.nav-item.nav-start { margin: 0 0 14px; background: var(--accent-soft); }
.nav-item.nav-start .nid { color: var(--accent); }
.nav-item.nav-start.aktiv { background: var(--strong); }

/* klar-knappen */
.klarbox { display: flex; gap: 12px; align-items: stretch; margin-top: 14px; }
.klarknapp {
  flex: 1; display: flex; align-items: center; gap: 18px; text-align: left; cursor: pointer;
  padding: 16px 20px; border-radius: var(--radius); border: 2px dashed var(--line-strong); background: var(--card); color: var(--ink);
  transition: background .2s, border-color .2s, transform .1s;
}
.klarknapp:hover { border-color: var(--ok); }
.klarknapp:active { transform: scale(.99); }
.klar-cirkel {
  position: relative; flex: none; width: 56px; height: 56px; border-radius: 50%; border: 3px solid var(--line-strong);
  display: grid; place-items: center; background: var(--card); transition: background .2s, border-color .2s;
}
.klar-cirkel svg { width: 30px; height: 30px; fill: none; stroke: var(--line-strong); stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 24; stroke-dashoffset: 24; }
.klarknapp:not(.klar):hover .klar-cirkel svg { stroke-dashoffset: 0; }
.klar-text strong { display: block; font-family: var(--serif); font-size: 21px; line-height: 1.25; }
.klar-text span { color: var(--muted); font-size: 14px; }
.klarknapp.klar { border-style: solid; border-color: var(--ok); background: var(--ok-soft); }
.klarknapp.klar .klar-cirkel { background: var(--ok); border-color: var(--ok); }
.klarknapp.klar .klar-cirkel svg { stroke: #fff; stroke-dashoffset: 0; transition: stroke-dashoffset .35s .1s ease-out; }
.klarknapp.klar strong { color: var(--ok); }
.klarknapp.pop .klar-cirkel { animation: pop .45s cubic-bezier(.2, 1.6, .4, 1); }
@keyframes pop { 0% { transform: scale(.7); } 60% { transform: scale(1.15); } 100% { transform: scale(1); } }
.klar-nasta { display: flex; align-items: center; padding: 0 22px; border-radius: var(--radius); background: var(--ok); color: #fff; font-weight: 700; text-decoration: none; white-space: nowrap; }
.klar-nasta:hover { filter: brightness(1.1); }
.klar-nasta[hidden] { display: none; }
.konfetti { position: absolute; left: 50%; top: 50%; width: 8px; height: 8px; border-radius: 2px; pointer-events: none; animation: konfetti .75s ease-out forwards; }
@keyframes konfetti {
  from { transform: translate(-50%, -50%) rotate(0); opacity: 1; }
  to { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) rotate(var(--rot)); opacity: 0; }
}
/* klar och nästa uppe i kortets huvud, så att man slipper scrolla ned */
.snabb { display: flex; gap: 8px; align-self: flex-start; }
.snabb-klar, .snabb-nasta { display: inline-flex; align-items: center; gap: 7px; height: 34px; padding: 0 14px; border-radius: 999px; font: inherit; font-size: 13.5px; font-weight: 700; white-space: nowrap; cursor: pointer; }
.snabb-klar { border: 1.5px dashed var(--line); background: var(--card); color: var(--ink); }
.snabb-klar:hover { border-color: var(--ok); }
.snabb-klar .snabb-bock { display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid var(--line-strong); color: transparent; font-size: 11px; }
.snabb-klar.klar { border-style: solid; border-color: var(--ok); background: var(--ok); color: #fff; }
.snabb-klar.klar .snabb-bock { border-color: #fff; color: #fff; }
.snabb-klar.pop { animation: pop .45s cubic-bezier(.2, 1.6, .4, 1); }
.snabb-nasta { border: 1.5px solid var(--strong); background: var(--strong); color: #fff; text-decoration: none; }
.snabb-nasta:hover { filter: brightness(1.25); }
.snabb-nasta.gron { border-color: var(--ok); background: var(--ok); }
.snabb-nasta[hidden] { display: none; }
@media (prefers-reduced-motion: reduce) {
  .klarknapp.pop .klar-cirkel, .snabb-klar.pop { animation: none; }
  .konfetti { display: none; }
}

.prevnext { display: flex; justify-content: space-between; gap: 10px; margin: 18px 0 24px; }
.prevnext a { color: var(--ink); text-decoration: none; padding: 9px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); font-weight: 600; font-size: 14px; }
.prevnext a:hover { border-color: var(--ink); }
.prevnext a[hidden] { display: none; }

/* ---------- spelaren ---------- */
.player {
  position: sticky; bottom: 0; z-index: 2000; margin: 0 -28px; padding: 10px 28px;
  background: var(--bar-genom); color: var(--bar-text); backdrop-filter: blur(6px);
}
/* fliken ovanför spelaren: göm det mesta, så att mer av noterna syns; ▶ ■ och tempot finns kvar */
.fall { position: absolute; right: 16px; bottom: 100%; height: 26px; padding: 0 12px; border: 0; border-radius: 10px 10px 0 0;
  background: var(--bar-genom); color: var(--bar-dov); font-size: 12.5px; font-weight: 700; cursor: pointer; }
.fall:hover { color: var(--bar-text); }
.player.liten { padding-top: 6px; padding-bottom: 6px; }
.player.liten #klick, .player.liten #kompknapp, .player.liten #chips, .player.liten .toggles,
.player.liten .komp, .player.liten #print, .player.liten .status { display: none; }
.player-inner { max-width: 1000px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; }
.pbtn { border: 0; cursor: pointer; border-radius: 999px; background: var(--bar-2); color: var(--bar-text); height: 38px; min-width: 38px; padding: 0 12px; font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.pbtn:hover { background: var(--bar-3); }
.pbtn.play { background: var(--accent); width: 46px; height: 46px; font-size: 18px; padding: 0; }
.pbtn.play:disabled { opacity: .5; cursor: wait; }
.pbtn.klick[aria-pressed="true"] { background: #e9a07f; color: #1f1c18; }
#komp-at { position: absolute; left: -10000px; top: 0; width: 600px; height: 10px; overflow: hidden; }
.pbtn.klick.slag { animation: klickslag .18s ease-out; }
.pbtn.klick.slag.etta { animation-name: klicketta; }
@keyframes klickslag { from { box-shadow: 0 0 0 4px rgba(233, 160, 127, .55); } to { box-shadow: 0 0 0 0 rgba(233, 160, 127, 0); } }
@keyframes klicketta { from { box-shadow: 0 0 0 6px rgba(247, 243, 236, .8); } to { box-shadow: 0 0 0 0 rgba(247, 243, 236, 0); } }
.tempo { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
.tempo .bpm { min-width: 74px; text-align: center; font-variant-numeric: tabular-nums; font-weight: 700; font-size: 15px; }
.chip { border: 1px solid var(--bar-linje); background: none; color: var(--bar-chip); border-radius: 8px; padding: 3px 8px; font-size: 12.5px; font-weight: 600; cursor: pointer; font-variant-numeric: tabular-nums; }
.chip.on { background: var(--bar-text); color: #1f1c18; border-color: var(--bar-text); }
.toggles { display: flex; gap: 6px; flex-wrap: wrap; }
.tog { border: 1px solid var(--bar-linje); background: none; color: var(--bar-dov); border-radius: 999px; padding: 5px 11px; font-size: 12.5px; font-weight: 600; cursor: pointer; }
.tog[aria-pressed="true"] { background: #e9a07f; border-color: #e9a07f; color: #1f1c18; }
.komp { display: inline-flex; align-items: center; border: 1px solid var(--bar-linje); border-radius: 999px; overflow: hidden; font-size: 12.5px; }
.komp span { padding: 0 8px 0 11px; color: var(--bar-dovare); font-weight: 600; }
.kval { border: none; border-left: 1px solid var(--bar-linje); background: none; color: var(--bar-dov); padding: 5px 10px; font-size: 12.5px; font-weight: 600; cursor: pointer; }
.kval[aria-pressed="true"] { background: #e9a07f; color: #1f1c18; }
.player .status { color: var(--bar-dov); margin-left: auto; }

/* noterna i mörkt läge: alphaTab ritar svart, så vänd ljusheten men behåll nyansen */
.mork .at-surface { filter: invert(.9) hue-rotate(180deg); }
body.pappersvy .at-surface { filter: none; }

/* alphaTab-markör */
.at-cursor-bar { background: rgba(176, 80, 42, .10); }
.at-cursor-beat { background: var(--accent); width: 3px; }
.at-selection div { background: rgba(176, 80, 42, .15); }
.at-highlight * { fill: var(--accent); stroke: var(--accent); }

/* ---------- mobil ---------- */
@media (max-width: 900px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  .sidebar { display: none; }
  #kortval { display: block; flex: 1; min-width: 0; }
  /* smala mobiler: lite mindre logga och växlare, så att kortlistan får plats */

    .brand { font-size: 16.5px; }
    .topbar { gap: 8px; }

  }
  /* på mobilen behöver kortlistan platsen i toppen; donationen finns på startsidan och i Start här */

  .topbar .spacer { display: none; }

  main { padding: 18px 16px 0; }
  .player { margin: 0 -16px; padding: 10px 16px; }
  .grid2, .grid3 { grid-template-columns: minmax(0, 1fr); }
  #print { display: none; }
  /* tempotrappans steg som en egen rad med stora knappar, så att man slipper trycka − och + många gånger */
  #chips { flex-basis: 100%; display: flex; gap: 6px; margin-top: 2px; }
  .chip { flex: 1 1 0; min-width: 0; padding: 8px 0; font-size: 14px; }
  .player-inner { gap: 8px 10px; }
  .pbtn.play { width: 42px; height: 42px; }
  .kort-head { gap: 12px; flex-wrap: wrap; }
  .kort-id { min-width: 58px; height: 58px; font-size: 23px; border-radius: 13px; }
  .kort-head h1 { font-size: 23px; }
  .badge { margin-left: 0; }
  .snabb { width: 100%; }
  .snabb-klar, .snabb-nasta { flex: 1; justify-content: center; height: 40px; }
  .klarbox, .guide-start { flex-direction: column; }
  .mvy { padding: 22px 12px; }
  .mvy-tempo { gap: 6px; }
  .mvy-steg { width: 40px; height: 40px; font-size: 13px; }
  .mvy-bpm { min-width: 92px; }
  .mvy-bpm strong { font-size: 50px; }
  .mvy-val .seg { flex-wrap: wrap; justify-content: center; border-radius: 16px; }

  .klar-nasta { justify-content: center; padding: 12px; }
  .player .status { margin-left: 0; width: 100%; }
}

/* uppspelningsmarkörens färg ska inte följa med på papper */

/* alphaTab placerar notraderna absolut; låt dem flyta som vanliga block, så att höjden går att mäta

, "ny": false}, {"s": 2, "f": 5, "rot": true, "iv": "R", "namn": "G", "ny": false}, {"s": 2, "f": 7, "rot": false, "iv": "2", "namn": "A", "ny": true}, {"s": 2, "f": 8, "rot": false, "iv": "♭3", "namn": "B♭", "ny": false}, {"s": 2, "f": 10, "rot": false, "iv": "4", "namn": "C", "ny": false}, {"s": 2, "f": 12, "rot": false, "iv": "5", "namn": "D", "ny": false}, {"s": 2, "f": 13, "rot": false, "iv": "♭6", "namn": "E♭", "ny": true}, {"s": 2, "f": 15, "rot": false, "iv": "♭7", "namn": "F", "ny": false}, {"s": 2, "f": 17, "rot": true, "iv": "R", "namn": "G", "ny": false}, {"s": 3, "f": 2, "rot": false, "iv": "2", "namn": "A", "ny": true}, {"s": 3, "f": 3, "rot": false, "iv": "♭3", "namn": "B♭", "ny": false}, {"s": 3, "f": 5, "rot": false, "iv": "4", "namn": "C", "ny": false}, {"s": 3, "f": 7, "rot": false, "iv": "5", "namn": "D", "ny": false}, {"s": 3, "f": 8, "rot": false, "iv": "♭6", "namn": "E♭", "ny": true}, {"s": 3, "f": 10, "rot": false, "iv": "♭7", "namn": "F", "ny": false}, {"s": 3, "f": 12, "rot": true, "iv": "R", "namn": "G", "ny": false}, {"s": 3, "f": 14, "rot": false, "iv": "2", "namn": "A", "ny": true}, {"s": 3, "f": 15, "rot": false, "iv": "♭3", "namn": "B♭", "ny": false}, {"s": 3, "f": 17, "rot": false, "iv": "4", "namn": "C", "ny": false}, {"s": 4, "f": 3, "rot": false, "iv": "5", "namn": "D", "ny": false}, {"s": 4, "f": 4, "rot": false, "iv": "♭6", "namn": "E♭", "ny": true}, {"s": 4, "f": 6, "rot": false, "iv": "♭7", "namn": "F", "ny": false}, {"s": 4, "f": 8, "rot": true, "iv": "R", "namn": "G", "ny": false}, {"s": 4, "f": 10, "rot": false, "iv": "2", "namn": "A", "ny": true}, {"s": 4, "f": 11, "rot": false, "iv": "♭3", "namn": "B♭", "ny": false}, {"s": 4, "f": 13, "rot": false, "iv": "4", "namn": "C", "ny": false}, {"s": 4, "f": 15, "rot": false, "iv": "5", "namn": "D", "ny": false}, {"s": 4, "f": 16, "rot": false, "iv": "♭6", "namn": "E♭", "ny": true}, {"s": 4, "f": 18, "rot": false, "iv": "♭7", "namn": "F", "ny": false}, {"s": 5, "f": 3, "rot": true, "iv": "R", "namn": "G", "ny": false}, {"s": 5, "f": 5, "rot": false, "iv": "2", "namn": "A", "ny": true}, {"s": 5, "f": 6, "rot": false, "iv": "♭3", "namn": "B♭", "ny": false}, {"s": 5, "f": 8, "rot": false, "iv": "4", "namn": "C", "ny": false}, {"s": 5, "f": 10, "rot": false, "iv": "5", "namn": "D", "ny": false}, {"s": 5, "f": 11, "rot": false, "iv": "♭6", "namn": "E♭", "ny": true}, {"s": 5, "f": 13, "rot": false, "iv": "♭7", "namn": "F", "ny": false}, {"s": 5, "f": 15, "rot": true, "iv": "R", "namn": "G", "ny": false}, {"s": 5, "f": 17, "rot": false, "iv": "2", "namn": "A", "ny": true}, {"s": 5, "f": 18, "rot": false, "iv": "♭3", "namn": "B♭", "ny": false}], "las": null}, "tempo": [50, 60, 70, 80, 90, 100, 160], "takter": 18, "shuffle": false}], "start": [{"id": "valkommen", "rubrik": "Välkommen", "text": "<p>Gitarrteknik är korta övningar för gitarr och elbas som bygger på varandra. Varje övning har en egen sida som du kan öva från skärmen eller skriva ut på ett A4. Du tar <strong>en övning i taget, i ordning</strong>, och övar några minuter om dagen, gärna som uppvärmning.</p><ul><li><strong>Grunden (F1–F5):</strong> stadig puls, ett finger per band och de första tonerna i box 1. Här börjar de flesta, också du som har spelat ett tag. Sitter det redan går de övningarna fort.</li><li><strong>Boxarna (från övning 1):</strong> hit kan du gå direkt om din lärare säger det.</li></ul><p>Den här sidan förklarar allt du ser på övningarna. Läs den en gång, och kom tillbaka hit när något känns oklart.</p>"}, {"id": "sidan", "rubrik": "Sidan och menyn", "text": "<ul><li><strong>Menyn</strong> till vänster visar alla övningar. På mobilen finns den som en lista högst upp.</li><li>Övningarna är ordnade i <strong>kapitel</strong> och <strong>block</strong>. Varje block har en egen färg. Pilen vid en rubrik fäller ihop eller ut den.</li><li>Övningarna är <strong>numrerade i ordning</strong>: 1, 2, 3 … Förberedelsen för helt nya nybörjare heter F1–F5.</li><li>Knapparna <strong>Gitarr / Elbas</strong> högst upp byter instrument. Du är på gitarrsidan.</li><li><strong>Mörkt läge:</strong> sidan blir mörk om din telefon eller dator är inställd på det. Du kan också byta med ☾/☀ uppe till höger, eller i listan högst upp på mobilen.</li><li>När du är klar med en övning får den en <strong>grön bock ✓</strong> i menyn, och rubrikerna räknar hur många du har klarat (till exempel 2/5).</li><li>Bockarna sparas <strong>bara i den här webbläsaren</strong>. På en annan dator eller telefon syns de inte.</li><li>Sidan <strong>samlar inte in några uppgifter</strong> om dig. Det finns inga konton, och inget skickas någonstans.</li></ul>"}, {"id": "instrumentet", "rubrik": "Instrumentet", "text": "<p>Gitarren har <strong>6 strängar</strong>. Från den tjockaste till den tunnaste heter de <strong>E, A, D, G, B, e</strong>. När du håller instrumentet är den tjockaste strängen, E, överst, närmast ansiktet.</p><ul><li><strong>Banden</strong> är metallpinnarna på halsen. Band 1 är närmast huvudet, där stämskruvarna sitter. Du trycker ned strängen precis bakom bandet.</li><li><strong>Stäm</strong> innan du spelar. Under <a href=\"#metronom\"><strong>♩ Metronom och stämning</strong></a> i menyn finns en ton för varje sträng.</li><li>En <strong>öppen sträng</strong> (band 0) betyder att du spelar strängen utan att trycka ned den.</li><li>Vänsterhandens fingrar har nummer: <strong>1 = pekfinger, 2 = långfinger, 3 = ringfinger, 4 = lillfinger</strong>.</li><li><strong>Ett finger per band</strong>: inom en box tar varje finger sitt eget band. Står handen vid band 3 tar pekfingret band 3, långfingret band 4 och så vidare.</li><li>Du håller plektrumet mellan tummen och pekfingret. <strong>Nedslag</strong> (⊓) slår nedåt mot golvet, <strong>uppslag</strong> (V) uppåt. <strong>Växelslag</strong> betyder ned, upp, ned, upp … hela tiden, också när du byter sträng.</li></ul>"}, {"id": "greppbild", "rubrik": "Greppbilden", "text": "<p>Greppbilden visar <strong>var på halsen</strong> du ska spela. Den ritas som när du lutar dig fram och tittar ned på halsen medan du spelar. Därför ligger den tjockaste strängen <strong>längst ned</strong> i bilden, fast den är överst när du håller instrumentet.</p><ul><li>De vågräta linjerna är <strong>strängarna</strong>. Strängarnas namn står till vänster.</li><li>De lodräta linjerna är <strong>banden</strong>. Bandnumret står under.</li><li>En <strong>prick</strong> är en ton du ska spela. En <strong>vit ring</strong> är en öppen sträng. En <strong>blå prick</strong> är en ny ton som inte fanns i boxen förut (från kapitel 3).</li><li><strong>R</strong> (orange) är <strong>grundtonen</strong>, tonen som låter \"hemma\". I de här övningarna är grundtonen G.</li><li>Vissa bandnummer är <strong>fetstilta</strong> (3, 5, 7, 9, 12 …). Det är banden som har en markering, en prick, på halsen. De hjälper dig att hitta rätt.</li></ul><p>Med knapparna uppe till höger kan du byta vad som står i prickarna:</p><ul><li><strong>R / o</strong> visar bara grundtonerna. Börja med det läget.</li><li><strong>Intervaller</strong> visar varje tons avstånd från grundtonen (R, ♭3, 4, 5, ♭7). Det kommer vi till senare.</li><li><strong>Tonnamn</strong> visar vad tonerna heter: G, B♭, C, D och F. Tecknet ♭ betyder en halvton (ett band) lägre: B♭ ligger ett band under B.</li></ul>", "exempel": {"typ": "diagram", "diagram": {"lo": 3, "hi": 6, "strangar": ["E", "A", "D", "G", "B", "e"], "toner": [{"s": 0, "f": 3, "rot": true, "iv": "R", "namn": "G", "ny": false}, {"s": 0, "f": 6, "rot": false, "iv": "♭3", "namn": "B♭", "ny": false}, {"s": 1, "f": 3, "rot": false, "iv": "4", "namn": "C", "ny": false}, {"s": 1, "f": 5, "rot": false, "iv": "5", "namn": "D", "ny": false}, {"s": 2, "f": 3, "rot": false, "iv": "♭7", "namn": "F", "ny": false}, {"s": 2, "f": 5, "rot": true, "iv": "R", "namn": "G", "ny": false}, {"s": 3, "f": 3, "rot": false, "iv": "♭3", "namn": "B♭", "ny": false}, {"s": 3, "f": 5, "rot": false, "iv": "4", "namn": "C", "ny": false}, {"s": 4, "f": 3, "rot": false, "iv": "5", "namn": "D", "ny": false}, {"s": 4, "f": 6, "rot": false, "iv": "♭7", "namn": "F", "ny": false}, {"s": 5, "f": 3, "rot": true, "iv": "R", "namn": "G", "ny": false}, {"s": 5, "f": 6, "rot": false, "iv": "♭3", "namn": "B♭", "ny": false}], "las": null}, "text": "Box 1 i G-mollpentatonik, den första boxen du lär dig. Prova knapparna."}}, {"id": "tabb", "rubrik": "Tabulatur (tabb)", "text": "<p>Tabben visar <strong>vilken sträng och vilket band</strong> du ska spela, i rätt ordning.</p><ul><li>Linjerna är strängarna, precis som i greppbilden: <strong>översta linjen är den tunnaste strängen</strong>, nedersta är den tjockaste, E.</li><li>Siffran på en linje säger <strong>vilket band</strong> du ska trycka ned. <strong>0</strong> betyder öppen sträng.</li><li>Du läser från <strong>vänster till höger</strong>, en siffra i taget.</li><li>Strecken under siffrorna visar <strong>rytmen</strong>, alltså hur långa tonerna är. I övningarna ser du rytmen tydligast i noterna ovanför tabben (se nästa avsnitt).</li></ul>", "exempel": {"typ": "tex", "tex": "\\tempo 80\n\\track \"Gitarr\" { instrument 25 }\n\\staff {tabs}\n\\tuning (E4 B3 G3 D3 A2 E2)\n\\ks Bb 3.6.8 6.6.8 3.5.8 5.5.8 3.4.8 5.4.8 3.3.8 5.3.8", "text": "De åtta första tonerna i box 1: två toner på varje sträng, nedifrån och upp."}}, {"id": "noter", "rubrik": "Noter och rytm", "text": "<p>Du behöver inte kunna läsa noter för att spela övningarna. Tabben räcker för att veta <em>vilka</em> toner du ska spela. Men noterna visar <strong>rytmen</strong>, alltså <em>när</em> och <em>hur länge</em> varje ton ska låta.</p><ul><li>Noterna står på fem linjer. Tecknet först på raden är en <strong>G-klav</strong>. Sedan kommer <strong>förtecknet</strong> (två ♭) som visar tonarten, G-moll.</li><li><strong>4/4</strong> betyder fyra slag i varje <strong>takt</strong>. Takterna skiljs åt av lodräta <strong>taktstreck</strong>. Den lilla röda siffran är taktens nummer.</li><li><strong>Helnot</strong>: håll tonen i fyra slag. <strong>Halvnot</strong>: två slag. <strong>Fjärdedel</strong>: ett slag.</li><li><strong>Åttondelar</strong>: två toner på varje slag. De sitter ofta ihop med ett streck, en balk. Räkna \"1 och 2 och 3 och 4 och\".</li><li><strong>Trioler</strong>: tre toner på varje slag, markerade med en 3:a. Räkna \"tri-o-la, tri-o-la\".</li><li>En <strong>paus</strong> betyder att du är tyst så länge pausen varar.</li></ul>", "exempel": {"typ": "tex", "tex": "\\tempo 80\n\\track \"Gitarr\" { instrument 25 }\n\\staff {score tabs}\n\\tuning (E4 B3 G3 D3 A2 E2)\n\\ks Bb 5.4.1 {txt \"hel\"} |\n5.4.2 {txt \"halv\"} 5.4.2 |\n5.4.4 {txt \"fjärdedel\"} 5.4.4 5.4.4 5.4.4 |\n5.4.8 {txt \"åttondelar\"} 5.4.8 5.4.8 5.4.8 5.4.8 5.4.8 5.4.8 5.4.8 |\n5.4.8 {tu 3 txt \"trioler\"} 5.4.8 {tu 3} 5.4.8 {tu 3} 5.4.8 {tu 3} 5.4.8 {tu 3} 5.4.8 {tu 3} 5.4.8 {tu 3} 5.4.8 {tu 3} 5.4.8 {tu 3} 5.4.8 {tu 3} 5.4.8 {tu 3} 5.4.8 {tu 3} |\n5.4.4 {txt \"paus\"} r.4 r.2", "text": "Samma ton, G, med olika notvärden. Noterna står ovanför, tabben under."}}, {"id": "puls", "rubrik": "Puls, BPM och metronom", "text": "<ul><li><strong>Pulsen</strong> är de jämna slagen i musiken, de du stampar takten till.</li><li><strong>BPM</strong> betyder <em>beats per minute</em>, slag per minut. <strong>♩ = 60</strong> betyder 60 slag per minut, alltså ett slag i sekunden. Högre tal går snabbare.</li><li>En <strong>metronom</strong> klickar på varje slag, så att du håller tempot jämnt. Första slaget i varje takt låter lite annorlunda.</li><li>Att spela <strong>jämnt</strong> i ett lugnt tempo är viktigare än att spela fort.</li><li>Vill du öva något annat, till exempel en skala eller en låt? Under <a href=\"#metronom\"><strong>♩ Metronom och stämning</strong></a> i menyn finns en metronom där du väljer tempo själv.</li></ul>", "exempel": {"typ": "metronom", "text": "Prova att lyssna på några olika tempon. Klappa eller räkna med."}}, {"id": "kortet", "rubrik": "Övningens delar", "text": "<p>Alla övningar ser likadana ut. Uppifrån och ned:</p><ul><li><strong>Nummer, namn och block</strong> högst upp.</li><li><strong>Cellen</strong> är övningens grundidé, i siffror och som första takten i noter. Siffrorna är tonerna i boxen räknat nedifrån: 1 är lägsta tonen. \"1 2 3 4 · 2 3 4 5\" betyder fyra toner uppåt, och sedan fyra toner uppåt igen men med start en ton högre. Förstår du cellen har du förstått övningen.</li><li><strong>Greppbild</strong>: var på halsen du spelar.</li><li><strong>Hela övningen</strong> i noter och tabb.</li><li><strong>Mål</strong>: vad du ska tänka på.</li><li><strong>Så gör du</strong>: hur du spelar övningen, steg för steg.</li><li><strong>Variationer</strong> (V1, V2, V3): nya sätt att spela samma övning när den sitter.</li><li><strong>Tempotrappan</strong>: börja på det lägsta tempot. Kryssa i rutan när du kan spela övningen <strong>tre gånger i rad utan att stanna</strong>. Gå sedan upp ett steg.</li><li><strong>Klar-knappen</strong>: tryck när övningen sitter. Den får en bock i menyn, och du kan gå vidare till nästa. <strong>Klar?</strong> och <strong>Nästa →</strong> finns också högst upp på sidan, så att du slipper scrolla.</li></ul>"}, {"id": "spelaren", "rubrik": "Spelaren", "text": "<p>Längst ned på varje övning finns spelaren. Med den kan du lyssna på övningen och spela med.</p><ul><li><strong>▶</strong> spelar och pausar. Du kan också trycka på mellanslag. <strong>■</strong> stoppar och går tillbaka till början.</li><li><strong>− och +</strong> ändrar tempot fem slag i taget. Siffrorna bredvid är tempotrappans steg.</li><li><strong>Metronom</strong> slår på och av klicket.</li><li><strong>♩ Bara klick</strong> startar bara metronomen i övningens tempo, utan noter och komp. Bra när du vill spela övningen själv eller öva något annat en stund. − och + ändrar tempot medan det klickar, och ▶ tar över när du vill höra övningen.</li><li><strong>∞ Bara komp</strong> spelar bara kompet (trummor och ackord) i övningens tempo, om och om igen tills du trycker <strong>■</strong>. Spela övningen i ditt eget tempo, eller improvisera fritt med tonerna från övningen. − och + ändrar tempot medan det spelar.</li><li><strong>Inräkning</strong> ger en takt med klick innan musiken börjar, så att du hinner göra dig redo.</li><li><strong>Loop</strong> spelar övningen om och om igen.</li><li><strong>Komp</strong> väljer vad som spelar med dig. <strong>Groove</strong> är trummor, bas och ackord, som ett litet band. <strong>Bordun</strong> är en låg ton (G och D) som ligger kvar och klingar, så att du hör tonarten. <strong>Av</strong> är bara du och metronomen.</li><li>Klicka på en not i övningen för att börja spela därifrån. Den färgade markören visar var du är.</li><li><strong>▾ Göm</strong> (fliken ovanför spelaren) gömmer det mesta av spelaren, så att du ser mer av noterna. ▶, ■ och tempot finns kvar. <strong>▴ Mer</strong> visar allt igen.</li><li>Första gången du trycker ▶ kan ljudet behöva några sekunder för att laddas.</li></ul>"}, {"id": "utskrift", "rubrik": "Skriva ut", "text": "<p>Knappen <strong>Skriv ut</strong> i spelaren ger övningen på ett A4. Bockar och uppspelning finns bara på skärmen, så kryssa i tempotrappan med penna på papperet.</p>"}, {"id": "ova", "rubrik": "Så övar du", "text": "<ul><li><strong>Några minuter varje dag</strong> är bättre än en lång stund en gång i veckan.</li><li><strong>Långsamt först.</strong> Spela rätt innan du spelar fort.</li><li><strong>Spela med metronomen.</strong> Öka tempot ett steg i taget.</li><li><strong>Håll handen avslappnad.</strong> Gör det ont eller känns spänt: ta en paus.</li><li>Lyssna på dig själv. Låter tonerna jämnt och rent?</li></ul>"}], "kompLoop": {"rak": "\\tempo 80\n\\track \"Kompbas\" { instrument 33 volume 10 }\n\\staff {score}\nG2.4 G2.4 D2.4 F2.4 | G2.4 G2.4 D2.4 F2.4 | C2.4 C2.4 G1.4 Bb1.4 | C2.4 C2.4 G1.4 Bb1.4\n\\track \"Ackord\" { instrument 4 volume 14 }\n\\staff {score}\n(G3 Bb3 D4).1 | (G3 Bb3 D4).1 | (G3 C4 Eb4).1 | (G3 C4 Eb4).1\n\\track \"Trummor\" { instrument percussion volume 16 }\n\\staff {score}\n\\articulation defaults\n(KickHit HiHatClosed).8 HiHatClosed.8 (SnareHit HiHatClosed).8 HiHatClosed.8 (KickHit HiHatClosed).8 (KickHit HiHatClosed).8 (SnareHit HiHatClosed).8 HiHatClosed.8 | (KickHit HiHatClosed).8 HiHatClosed.8 (SnareHit HiHatClosed).8 HiHatClosed.8 (KickHit HiHatClosed).8 (KickHit HiHatClosed).8 (SnareHit HiHatClosed).8 HiHatClosed.8 | (KickHit HiHatClosed).8 HiHatClosed.8 (SnareHit HiHatClosed).8 HiHatClosed.8 (KickHit HiHatClosed).8 (KickHit HiHatClosed).8 (SnareHit HiHatClosed).8 HiHatClosed.8 | (KickHit HiHatClosed).8 HiHatClosed.8 (SnareHit HiHatClosed).8 HiHatClosed.8 (KickHit HiHatClosed).8 (KickHit HiHatClosed).8 (SnareHit HiHatClosed).8 HiHatClosed.8", "shuffle": "\\tempo 80\n\\track \"Kompbas\" { instrument 33 volume 10 }\n\\staff {score}\nG2.4 G2.4 D2.4 F2.4 | G2.4 G2.4 D2.4 F2.4 | C2.4 C2.4 G1.4 Bb1.4 | C2.4 C2.4 G1.4 Bb1.4\n\\track \"Ackord\" { instrument 4 volume 14 }\n\\staff {score}\n(G3 Bb3 D4).1 | (G3 Bb3 D4).1 | (G3 C4 Eb4).1 | (G3 C4 Eb4).1\n\\track \"Trummor\" { instrument percussion volume 16 }\n\\staff {score}\n\\articulation defaults\n(KickHit RideMiddle).8 {tu 3} r.8 {tu 3} RideMiddle.8 {tu 3} (SnareHit RideMiddle).8 {tu 3} r.8 {tu 3} RideMiddle.8 {tu 3} (KickHit RideMiddle).8 {tu 3} r.8 {tu 3} RideMiddle.8 {tu 3} (SnareHit RideMiddle).8 {tu 3} r.8 {tu 3} RideMiddle.8 {tu 3} | (KickHit RideMiddle).8 {tu 3} r.8 {tu 3} RideMiddle.8 {tu 3} (SnareHit RideMiddle).8 {tu 3} r.8 {tu 3} RideMiddle.8 {tu 3} (KickHit RideMiddle).8 {tu 3} r.8 {tu 3} RideMiddle.8 {tu 3} (SnareHit RideMiddle).8 {tu 3} r.8 {tu 3} RideMiddle.8 {tu 3} | (KickHit RideMiddle).8 {tu 3} r.8 {tu 3} RideMiddle.8 {tu 3} (SnareHit RideMiddle).8 {tu 3} r.8 {tu 3} RideMiddle.8 {tu 3} (KickHit RideMiddle).8 {tu 3} r.8 {tu 3} RideMiddle.8 {tu 3} (SnareHit RideMiddle).8 {tu 3} r.8 {tu 3} RideMiddle.8 {tu 3} | (KickHit RideMiddle).8 {tu 3} r.8 {tu 3} RideMiddle.8 {tu 3} (SnareHit RideMiddle).8 {tu 3} r.8 {tu 3} RideMiddle.8 {tu 3} (KickHit RideMiddle).8 {tu 3} r.8 {tu 3} RideMiddle.8 {tu 3} (SnareHit RideMiddle).8 {tu 3} r.8 {tu 3} RideMiddle.8 {tu 3}"}};
const AT = 'lib/alphatab/';
const GRUNDTEMPO = 80; // \tempo i alla övningar; spelhastigheten räknas om från detta
const $ = s => document.querySelector(s);
const INST = DATA.instrument;

const store = {
  get(k, d) { try { const v = localStorage.getItem('tk:' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('tk:' + k, JSON.stringify(v)); } catch (e) {} },
};

const kort = DATA.kort;
const blockkod = k => /^[A-F]\./.test(k.block) ? k.block[0] : '0';
const byId = Object.fromEntries(kort.map(k => [k.id, k]));
const opts = Object.assign({ metronom: true, inrakning: false, loop: true, komp: 'groove', diag: 'ro' }, store.get('opts', {}));
if (!['av', 'bordun', 'groove'].includes(opts.komp)) opts.komp = 'groove';
delete opts.bordun;
// kompspåren ligger i varje övning men ritas inte; valet avgör vilka som tystas
const KOMPSPAR = { av: [], bordun: ['Bordun'], groove: ['Trummor', 'Kompbas', 'Ackord'] };
const ALLA_KOMP = ['Bordun', 'Trummor', 'Kompbas', 'Ackord'];
const tyst = namn => ALLA_KOMP.includes(namn) && !KOMPSPAR[opts.komp].includes(namn);
const texMedKomp = tex => tex.replace(/\\track "([^"]+)" \{ ([^}]*?) ?\}/g,
  (m, namn, egenskaper) => tyst(namn) ? `\\track "${namn}" { ${egenskaper} mute }` : m);
let current = null, bpm = 60, ready = false, playing = false, tillToppen = false;
history.scrollRestoration = 'manual';

/* ---------- alphaTab ---------- */
const NE = alphaTab.NotationElement;
const dolda = () => new Map([[NE.EffectDynamics, false], [NE.GuitarTuning, false], [NE.TrackNames, false], [NE.EffectTempo, false]]);
const smal = () => window.innerWidth < 600;

const main = new alphaTab.AlphaTabApi($('#main-at'), {
  core: { fontDirectory: AT + 'font/', enableLazyLoading: false },
  notation: { elements: dolda() },
  display: { scale: smal() ? 0.8 : 1 },
  player: { enablePlayer: true, enableCursor: true, enableUserInteraction: true, soundFont: AT + 'soundfont/sonivox.sf2', scrollMode: alphaTab.ScrollMode.Off, scrollOffsetY: -120 },
});
const cell = new alphaTab.AlphaTabApi($('#cell-at'), {
  core: { fontDirectory: AT + 'font/', enableLazyLoading: false },
  notation: { elements: dolda() },
  display: { scale: 0.8 },
  player: { enablePlayer: false, scrollMode: alphaTab.ScrollMode.Off },
});

main.soundFontLoad.on(e => { if (e.total) status(`Laddar ljud … ${Math.round(e.loaded / e.total * 100)} %`); });
main.playerReady.on(() => { ready = true; status('Redo – tryck ▶ (eller mellanslag)'); updatePlay(); applyOpts(); });
main.playerStateChanged.on(e => {
  playing = e.state === 1;
  if (playing && metro && metro.yta === $('#klick')) stoppaMetronom(); // ▶ tar över från bara klick
  if (playing) stoppaKomp(); // … och från bara komp
  // följ markören bara under uppspelning, annars hoppar sidan när ett kort laddas
  main.settings.player.scrollMode = playing ? alphaTab.ScrollMode.Continuous : alphaTab.ScrollMode.Off;
  main.updateSettings();
  updatePlay();
});
main.scoreLoaded.on(() => applyOpts());
// nytt kort ska alltid börja högst upp, även om alphaTab flyttar sidan medan noterna ritas
main.postRenderFinished.on(() => {
  if (!tillToppen) return;
  tillToppen = false;
  requestAnimationFrame(() => window.scrollTo(0, 0));
});
main.error.on(e => status('Något gick fel: ' + (e && e.message ? e.message : e)));

function status(t) { $('#status').textContent = t; }
function updatePlay() {
  const b = $('#play');
  b.disabled = !ready;
  b.textContent = playing ? '❚❚' : '▶';
  b.setAttribute('aria-label', playing ? 'Pausa' : 'Spela');
}

function applyOpts() {
  main.metronomeVolume = opts.metronom ? 1 : 0;
  main.countInVolume = opts.inrakning ? 1 : 0;
  main.isLooping = opts.loop;
  main.playbackSpeed = bpm / GRUNDTEMPO;
  if (main.score) {
    for (const t of main.score.tracks) {
      if (ALLA_KOMP.includes(t.name)) { try { main.changeTrackMute([t], tyst(t.name)); } catch (e) {} }
    }
  }
  document.querySelectorAll('.tog').forEach(b => b.setAttribute('aria-pressed', String(!!opts[b.dataset.opt])));
  document.querySelectorAll('.kval').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.komp === opts.komp)));
}

/* ---------- navigering ---------- */
function buildNav() {
  const andra = INST === 'gitarr' ? ['bas', 'Elbas'] : ['gitarr', 'Gitarr'];
  $('#inst-switch').innerHTML = INST === 'gitarr'
    ? `<a class="on">Gitarr</a><a href="bas.html">Elbas</a>`
    : `<a href="gitarr.html">Gitarr</a><a class="on">Elbas</a>`;
  $('#inst-switch').querySelectorAll('a[href]').forEach(a => a.addEventListener('click', () => { a.href = andra[0] + '.html' + location.hash; }));

  // hopfällda kapitel/block sparas per instrument; nycklar som "k1" och "k1|A. Box 1 på djupet"
  const stangda = new Set(store.get(INST + ':stangda', []));
  const oppen = nyckel => stangda.has(nyckel) ? '' : ' open';
  let nav = `<div class="nav-verktyg"><button data-alla="stang">Fäll ihop alla</button><button data-alla="oppna">Fäll ut alla</button></div>`
    + `<a href="#start" data-id="start" class="nav-item nav-start"><span class="nid">★</span><span class="nt">Start här: så funkar det</span><span class="prog"></span></a>`
    + `<a href="#metronom" data-id="metronom" class="nav-item nav-metro"><span class="nid">♩</span><span class="nt">Metronom och stämning</span><span class="prog"></span></a>`;
  let sel = `<option value="start">★ Start här: så funkar det</option><option value="metronom">♩ Metronom och stämning</option><option value="tema" id="tema-val"></option>`;
  for (const [kn, kap] of Object.entries(DATA.kapitel)) {
    nav += `<details class="nav-kap" data-nyckel="k${kn}"${oppen('k' + kn)}><summary><h3><span>Kapitel ${kn}<em class="raknare" data-rakna="k${kn}"></em></span>${kap.titel}</h3></summary><p>${kap.intro}</p>`;
    sel += `<optgroup label="Kapitel ${kn} · ${kap.titel}">`;
    let block = null;
    for (const k of kort.filter(k => String(k.kap) === kn)) {
      if (k.block !== block) {
        if (block !== null) nav += '</details>';
        block = k.block;
        const nyckel = `k${kn}|${block}`;
        nav += `<details class="nav-blk" data-nyckel="${nyckel}"${oppen(nyckel)}><summary><h4 class="b${blockkod(k)}">${block}<span class="raknare" data-rakna="${nyckel}"></span></h4></summary>`;
      }
      nav += `<a href="#${k.id}" data-id="${k.id}" class="nav-item"><span class="nid">${k.id}</span><span class="nt">${k.titel}</span><span class="prog" data-prog="${k.id}"></span></a>`;
      sel += `<option value="${k.id}">${k.id}  ${k.titel}</option>`;
    }
    if (block !== null) nav += '</details>';
    nav += '</details>'; sel += '</optgroup>';
  }
  $('#nav').innerHTML = nav;
  const sparaStangda = () => store.set(INST + ':stangda',
    [...document.querySelectorAll('#nav details:not([open])')].map(d => d.dataset.nyckel));
  document.querySelectorAll('#nav details').forEach(d => d.addEventListener('toggle', sparaStangda));
  document.querySelectorAll('.nav-verktyg button').forEach(b => b.onclick = () => {
    const stang = b.dataset.alla === 'stang';
    document.querySelectorAll('#nav details').forEach(d => {
      // vid "fäll ihop alla" hålls blocken öppna inuti, så att ett utfällt kapitel visar sina kort
      if (d.classList.contains('nav-kap')) d.open = !stang; else d.open = true;
    });
  });
  $('#kortval').innerHTML = sel;
  $('#kortval').onchange = e => {
    // på smala mobiler ligger ljust/mörkt läge i listan i stället för som knapp i toppen
    if (e.target.value === 'tema') { tema.byt(); visaTema(); e.target.value = decodeURIComponent(location.hash.slice(1)) || kort[0].id; return; }
    location.hash = e.target.value;
  };
  kort.forEach(updateProg);
  updateRaknare();
}

function klar(k, t) { return store.get(`${INST}:${k.id}:${t}`, false); }
function arKlar(k) { return store.get(`${INST}:klar:${k.id}`, false); }
function updateProg(k) {
  const el = document.querySelector(`[data-prog="${k.id}"]`);
  if (el) el.innerHTML = arKlar(k) ? '<span class="bock" title="Klar">✓</span>'
    : k.tempo.some(t => klar(k, t)) ? k.tempo.map(t => klar(k, t) ? '●' : '○').join('') : '';
  const a = document.querySelector(`.nav-item[data-id="${k.id}"]`);
  if (a) a.classList.toggle('klar', arKlar(k));
  const o = [...$('#kortval').options].find(o => o.value === k.id);

/* ---------- greppbild ---------- */
function renderDiagram() {
  const d = current.diagram;
  const mode = d.las || opts.diag;

  $('#diag-seg').querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.mode === mode));
  const { svg, n } = greppbildSvg(d, mode);
  $('#diagram').innerHTML = svg + (d.toner.some(t => t.ny)
    ? '<p class="diagram-not"><span class="ny-prick"></span>blå = nya toner</p>' : '');
  // breda greppbilder (t.ex. formkedjan) får en egen rad
  document.querySelector('.grid2').classList.toggle('bred', n > 8);
  $('#kortvy').classList.toggle('bred-diagram', n > 8);

function greppbildSvg(d, mode) {
  const harOppen = d.lo === 0;
  const start = harOppen ? 1 : d.lo;
  const slut = Math.max(d.hi, start + 3);
  const n = slut - start + 1;
  const S = d.strangar.length;
  const fw = 46, ss = 28, left = harOppen ? 62 : 34, top = 18;
  const w = left + n * fw + 14, h = top + (S - 1) * ss + 40;
  const y = s => top + (S - 1 - s) * ss;
  const x = f => f === 0 ? left - 22 : left + (f - start + 0.5) * fw;

  let g = '';
  for (let s = 0; s < S; s++) {
    g += `<line x1="${left}" y1="${y(s)}" x2="${left + n * fw}" y2="${y(s)}" stroke="var(--g-strang)" stroke-width="${1 + (S - 1 - s) * 0.3}"/>`;
    g += `<text x="${harOppen ? left - 44 : left - 16}" y="${y(s) + 4}" font-size="12" fill="var(--muted)" text-anchor="middle" font-weight="600">${d.strangar[s]}</text>`;
  }
  for (let k = 0; k <= n; k++) {
    const nut = harOppen && k === 0;
    g += `<line x1="${left + k * fw}" y1="${top - 6}" x2="${left + k * fw}" y2="${y(0) + 6}" stroke="${nut ? 'var(--ink)' : 'var(--g-band)'}" stroke-width="${nut ? 5 : 1.5}"/>`;
  }
  for (let f = start; f <= slut; f++) {
    const markerad = [3, 5, 7, 9, 12, 15, 17].includes(f);
    g += `<text x="${x(f)}" y="${y(0) + 26}" font-size="12" text-anchor="middle" fill="${markerad ? 'var(--ink)' : 'var(--g-bandnr)'}" font-weight="${markerad ? 700 : 500}">${f}</text>`;
  }
  for (const t of d.toner) {
    const label = mode === 'ro' ? (t.rot ? 'R' : '') : mode === 'iv' ? t.iv : t.namn;
    const cx = x(t.f), cy = y(t.s);
    const fill = t.rot ? 'var(--accent)' : t.ny ? 'var(--ny)' : (t.f === 0 ? 'var(--card)' : 'var(--ink)');
    const stroke = t.f === 0 && !t.rot ? 'var(--ink)' : 'none';
    const textFill = t.f === 0 && !t.rot ? 'var(--ink)' : t.rot || t.ny ? '#fff' : 'var(--card)';
    g += `<circle cx="${cx}" cy="${cy}" r="11.5" fill="${fill}" stroke="${stroke}" stroke-width="2"/>`;
    if (label) g += `<text x="${cx}" y="${cy + 4}" font-size="${label.length > 2 ? 9.5 : 11.5}" text-anchor="middle" fill="${textFill}" font-weight="700">${label}</text>`;
  }
  const svg = `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="Greppbild" style="max-width:${w * 1.15}px;font-family:Inter,system-ui,sans-serif">${g}</svg>`;
  return { svg, n };
}

function metronomWidget(yta) {

      <button class="metro-knapp" data-bpm="0">■ Stopp</button></div>
  </div>`;
  yta.querySelectorAll('.metro-knapp').forEach(b => b.onclick = () => {

  });

// s = { tempo, slag (per takt), under (klick per slag) }; tempot läses vid varje klick, så det kan ändras medan den går
function startaMetronom(s, yta) {
  metroCtx = metroCtx || new (window.AudioContext || window.webkitAudioContext)();
  metroCtx.resume();
  const ctx = metroCtx, denna = { yta };
  let steg = 0, nasta = ctx.currentTime + 0.1;
  const schemalagg = () => {
    while (nasta < ctx.currentTime + 0.15) {
      const del = steg % s.under, nr = Math.floor(steg / s.under) % s.slag;
      const osc = ctx.createOscillator(), gain = ctx.createGain();
      osc.frequency.value = del ? 760 : nr === 0 && s.slag > 1 ? 1600 : 1000;
      gain.gain.setValueAtTime(0.0001, nasta);
      gain.gain.exponentialRampToValueAtTime(del ? 0.14 : 0.4, nasta + 0.002);
      gain.gain.exponentialRampToValueAtTime(0.0001, nasta + (del ? 0.04 : 0.06));
      osc.connect(gain).connect(ctx.destination);
      osc.start(nasta); osc.stop(nasta + 0.07);
      if (!del) setTimeout(() => {
        if (metro !== denna) return;
        yta.querySelectorAll('.metro-slag span').forEach((p, i) => p.classList.toggle('on', i === nr));
        if (s.paSlag) s.paSlag(nr);
      }, Math.max(0, (nasta - ctx.currentTime) * 1000));
      nasta += 60 / s.tempo / s.under; steg++;
    }
  };
  schemalagg();
  denna.timer = setInterval(schemalagg, 25);
  metro = denna;
}
function stoppaMetronom() {
  if (!metro) return;
  clearInterval(metro.timer);
  metro.yta.querySelectorAll('.metro-slag span, .metro-knapp').forEach(el => el.classList.remove('on'));
  const start = metro.yta.querySelector('.mvy-start');
  if (start) { start.classList.remove('on'); start.textContent = '▶ Starta'; }
  if (metro.yta === $('#klick')) { $('#klick').setAttribute('aria-pressed', 'false'); $('#klick').classList.remove('slag'); }
  metro = null;
}

/* ---------- bara komp: groove-loopen i kortets tempo, utan noter, tills man trycker stopp ---------- */
// en egen liten spelare med fyra takter komp (DATA.kompLoop), skapas först när knappen används
let kompApi = null, kompTyp = null, kompRedo = false, kompVill = false;
function kompSpelare() {

}
function spelaKomp() {

}
function startaKomp() {
  main.pause();

  else if (kompRedo) { api.stop(); spelaKomp(); }
}
function stoppaKomp() {
  if (!kompVill) return;
  kompVill = false;
  if (kompApi) kompApi.stop();
  visaKomp();
  if (ready) status('Redo – tryck ▶ (eller mellanslag)');
}

/* ---------- stämtoner ---------- */
// [strängnummer, tonnamn, frekvens i Hz], från tjockaste strängen
const STAMNING = INST === 'gitarr'
  ? [['6', 'E', 82.41], ['5', 'A', 110.00], ['4', 'D', 146.83], ['3', 'G', 196.00], ['2', 'B', 246.94], ['1', 'E', 329.63]]
  : [['4', 'E', 41.20], ['3', 'A', 55.00], ['2', 'D', 73.42], ['1', 'G', 98.00]];
let ton = null;
function spelaTon(f, knapp) {
  metroCtx = metroCtx || new (window.AudioContext || window.webkitAudioContext)();
  metroCtx.resume();
  const ctx = metroCtx, t = ctx.currentTime, ut = ctx.createGain();
  // övertonerna gör att även basens djupa toner hörs i små högtalare
  const deltoner = INST === 'gitarr' ? [1, .5, .35, .2, .12] : [.5, 1, .8, .55, .35, .2];
  const osc = deltoner.map((a, i) => {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.value = f * (i + 1); g.gain.value = a / deltoner.length;
    o.connect(g).connect(ut); o.start(t);
    return o;
  });
  ut.gain.setValueAtTime(0.0001, t);
  ut.gain.exponentialRampToValueAtTime(0.5, t + 0.03);
  ut.connect(ctx.destination);
  knapp.setAttribute('aria-pressed', 'true');
  ton = { ut, osc, knapp, timer: setTimeout(stoppaTon, 30000) }; // tystnar av sig själv efter 30 s
}
function stoppaTon() {
  if (!ton) return;
  const { ut, osc, knapp, timer } = ton, t = metroCtx.currentTime;
  clearTimeout(timer);
  ut.gain.cancelScheduledValues(t);
  ut.gain.setValueAtTime(ut.gain.value, t);
  ut.gain.exponentialRampToValueAtTime(0.0001, t + 0.15);
  osc.forEach(o => o.stop(t + 0.2));
  knapp.setAttribute('aria-pressed', 'false');
  ton = null;
}

/* ---------- fristående metronom ---------- */
const mset = Object.assign({ tempo: 80, slag: 4, under: 1 }, store.get('metronom', {}));
let metroByggd = false, knack = [];
function showMetronom() {
  main.stop();
  stoppaMetronom();
  stoppaKomp();
  document.body.classList.add('guidelage', 'metrolage');
  $('#kortvy').hidden = true;
  $('#guide').hidden = true;
  $('#metrovy').hidden = false;
  document.title = `Metronom och stämning · ${DATA.titel} · Gitarrteknik`;
  markeraMeny('metronom');
  if (!metroByggd) { byggMetronom(); metroByggd = true; }
  window.scrollTo(0, 0);
}
function byggMetronom() {
  const yta = $('#metrovy');
  yta.innerHTML = `
    <div class="kort-head">
      <div class="kort-id start-id metro-id">♩</div>
      <div><div class="kap">${DATA.titel} · Öva fritt</div><h1>Metronom och stämning</h1></div>
    </div>
    <section class="panel mvy">
      <h2>Metronom</h2>
      <div class="mvy-tempo">
        <button class="mvy-steg" data-steg="-5" aria-label="5 långsammare">−5</button>
        <button class="mvy-steg" data-steg="-1" aria-label="1 långsammare">−1</button>
        <div class="mvy-bpm"><strong id="mvy-bpm"></strong><span>slag per minut</span></div>
        <button class="mvy-steg" data-steg="1" aria-label="1 snabbare">+1</button>
        <button class="mvy-steg" data-steg="5" aria-label="5 snabbare">+5</button>
      </div>
      <input type="range" id="mvy-reglage" min="30" max="240" step="1" aria-label="Tempo">
      <div class="metro-slag" id="mvy-prickar"></div>
      <button class="mvy-start" id="mvy-start">▶ Starta</button>
      <div class="mvy-val">
        <div><h2>Slag per takt</h2><div class="seg" id="mvy-slagval">${[2, 3, 4, 6].map(n => `<button data-slag="${n}">${n}</button>`).join('')}</div></div>
        <div><h2>Klick per slag</h2><div class="seg" id="mvy-underval">${[[1, '♩ Bara slagen'], [2, '♪♪ Åttondelar'], [3, 'Trioler'], [4, 'Sextondelar']].map(([n, t]) => `<button data-under="${n}">${t}</button>`).join('')}</div></div>
        <div><h2>Vet du tempot?</h2><button class="mvy-knacka" id="mvy-knacka">Knacka tempo</button></div>
      </div>
      <p class="mvy-tips">Mellanslag startar och stoppar. Börja i ett tempo där allt sitter, och höj fem slag i taget.
        Med åttondelar hörs ett svagare klick mellan slagen, bra när du spelar två toner per slag.</p>
    </section>
    <section class="panel mvy stam">
      <h2>Stämtoner · standardstämning</h2>
      <div class="stam-strangar">${STAMNING.map(([nr, ton], i) =>
        `<button class="stam-ton" data-i="${i}" aria-pressed="false"><span>${nr}</span><strong>${ton}</strong></button>`).join('')}</div>
      <p class="mvy-tips">Tryck på en sträng, så ringer tonen tills du trycker igen. Spela samma sträng och vrid
        på stämskruven tills de två tonerna låter som en. Svävar det (en vågande "wa-wa-wa") är det inte rätt än.
        Börja lite under tonen och skruva <strong>upp</strong> till den, då håller stämningen bättre.</p>
    </section>`;
  yta.querySelectorAll('.stam-ton').forEach(b => b.onclick = () => {
    const pa = b.getAttribute('aria-pressed') === 'true';
    stoppaTon();
    if (!pa) spelaTon(STAMNING[+b.dataset.i][2], b);
  });
  const spara = () => store.set('metronom', mset);
  const omstart = () => { if (metro && metro.yta === yta) { stoppaMetronom(); startaMetronom(mset, yta); visaStart(); } };
  const visaStart = () => {
    const pa = !!(metro && metro.yta === yta);
    $('#mvy-start').classList.toggle('on', pa);
    $('#mvy-start').textContent = pa ? '■ Stopp' : '▶ Starta';
  };
  const rita = () => {
    $('#mvy-bpm').textContent = mset.tempo;
    $('#mvy-reglage').value = mset.tempo;
    $('#mvy-prickar').innerHTML = Array.from({ length: mset.slag }, (_, i) => `<span>${i + 1}</span>`).join('');
    yta.querySelectorAll('[data-slag]').forEach(b => b.classList.toggle('on', +b.dataset.slag === mset.slag));
    yta.querySelectorAll('[data-under]').forEach(b => b.classList.toggle('on', +b.dataset.under === mset.under));
  };
  const satt = t => { mset.tempo = Math.min(240, Math.max(30, Math.round(t))); spara(); $('#mvy-bpm').textContent = mset.tempo; $('#mvy-reglage').value = mset.tempo; };
  yta.querySelectorAll('.mvy-steg').forEach(b => b.onclick = () => satt(mset.tempo + +b.dataset.steg));
  $('#mvy-reglage').oninput = e => satt(+e.target.value);
  yta.querySelectorAll('[data-slag]').forEach(b => b.onclick = () => { mset.slag = +b.dataset.slag; spara(); rita(); omstart(); });
  yta.querySelectorAll('[data-under]').forEach(b => b.onclick = () => { mset.under = +b.dataset.under; spara(); rita(); omstart(); });
  $('#mvy-start').onclick = () => {
    if (metro && metro.yta === yta) stoppaMetronom(); else { stoppaMetronom(); startaMetronom(mset, yta); }
    visaStart();
  };
  // knacka minst två gånger; medel av de senaste intervallen, ny serie efter två sekunders paus
  $('#mvy-knacka').onclick = () => {
    const nu = performance.now();
    if (knack.length && nu - knack[knack.length - 1] > 2000) knack = [];
    knack.push(nu); knack = knack.slice(-5);
    if (knack.length > 1) satt(60000 / ((knack[knack.length - 1] - knack[0]) / (knack.length - 1)));
  };
  rita();
}

/* ---------- händelser ---------- */
$('#play').onclick = () => main.playPause();
$('#stop').onclick = () => { main.stop(); stoppaKomp(); if (metro && metro.yta === $('#klick')) stoppaMetronom(); };
$('#slower').onclick = () => setBpm(bpm - 5);
$('#faster').onclick = () => setBpm(bpm + 5);
$('#print').onclick = skrivUt;
// göm/visa det mesta av spelaren; valet sparas i webbläsaren
function visaSpelare() {
  const liten = !!store.get('spelare-liten', false);
  $('#spelare').classList.toggle('liten', liten);
  $('#fall').textContent = liten ? '▴ Mer' : '▾ Göm';
  $('#fall').setAttribute('aria-expanded', String(!liten));
  $('#fall').title = liten ? 'Visa hela spelaren' : 'Göm det mesta av spelaren, så att mer av noterna syns';
}
$('#fall').onclick = () => { store.set('spelare-liten', !store.get('spelare-liten', false)); visaSpelare(); };
visaSpelare();
document.querySelectorAll('.tog').forEach(b => b.onclick = () => {
  opts[b.dataset.opt] = !opts[b.dataset.opt];
  store.set('opts', opts);
  applyOpts();
});
document.querySelectorAll('.kval').forEach(b => b.onclick = () => {
  opts.komp = b.dataset.komp;
  store.set('opts', opts);
  applyOpts();
});
$('#diag-seg').querySelectorAll('button').forEach(b => b.onclick = () => {
  opts.diag = b.dataset.mode; store.set('opts', opts); renderDiagram();
});
document.addEventListener('keydown', e => {
  if (e.code === 'Space' && document.body.classList.contains('metrolage') && !/SELECT|TEXTAREA/.test(e.target.tagName)) { e.preventDefault(); $('#mvy-start').click(); }
  if (e.code === 'Space' && !/INPUT|SELECT|TEXTAREA|BUTTON/.test(e.target.tagName) && ready && !document.body.classList.contains('guidelage')) { e.preventDefault(); if (kompVill) stoppaKomp(); else main.playPause(); }
});
// Skriv ut-knappen: lägg kortet i papperslayouten, rita om övningen i A4-bredd och prova allt
// mindre noter (fler takter per rad) tills hela kortet ryms på en A4. Skriv sedan ut och återställ.
// Ctrl+P går också (papperslayouten sätts i beforeprint), men utan anpassningen.
const PAPPER_BREDD = 718;  // A4 210 mm minus 2 × 10 mm marginal, i CSS-pixlar
const PAPPER_HOJD = 1035;  // A4 297 mm minus marginaler (≈ 1047 px) och lite luft
function vantaPaRitning(api) {
  return new Promise(klar => {
    const h = () => { api.postRenderFinished.off(h); klar(); };
    api.postRenderFinished.on(h);
  });
}
async function ritaFor(api, radlangd, skala) {
  api.settings.display.barsPerRow = radlangd;
  api.settings.display.scale = skala;
  api.updateSettings();
  const ritad = vantaPaRitning(api);
  api.render();
  await ritad;
}
let utskriftForberedd = false;
async function skrivUt() {
  if (document.body.classList.contains('guidelage')) return window.print();
  const el = $('#main-at');
  main.stop();
  status('Förbereder utskrift …');
  utskriftForberedd = true;
  document.body.classList.add('pappersvy');
  el.style.width = (PAPPER_BREDD - 22) + 'px';
  const tatast = Math.max(...main.score.tracks[0].staves[0].bars.map(b => b.voices[0].beats.length));
  const forsok = tatast > 8
    ? [[3, 0.72], [3, 0.64], [4, 0.6], [4, 0.54], [5, 0.5], [6, 0.46]]
    : [[4, 0.72], [4, 0.64], [5, 0.6], [6, 0.56], [6, 0.5], [8, 0.46]];
  for (const [radlangd, skala] of forsok) {
    await ritaFor(main, radlangd, skala);
    if ($('#kortvy').offsetHeight <= PAPPER_HOJD) break;
  }
  window.print();
  document.body.classList.remove('pappersvy');
  utskriftForberedd = false;
  el.style.width = '';
  await ritaFor(main, -1, smal() ? 0.8 : 1);
  status(ready ? 'Redo – tryck ▶ (eller mellanslag)' : 'Laddar …');
}

// Ctrl+P utan knappen: papperslayout, och skala ned skärmversionen av noterna så att de ryms
function anpassa(sel, w) { const el = $(sel); el.style.zoom = el.scrollWidth > w ? (w / el.scrollWidth).toFixed(3) : ''; }
window.addEventListener('beforeprint', () => {
  if (utskriftForberedd) return;
  document.body.classList.add('pappersvy');
  anpassa('#main-at', PAPPER_BREDD - 22);
});
window.addEventListener('afterprint', () => {
  if (utskriftForberedd) return;
  document.body.classList.remove('pappersvy');
  $('#main-at').style.zoom = '';
});
window.addEventListener('hashchange', () => visa(decodeURIComponent(location.hash.slice(1))));

// stöd-länken uppe till höger, bara på den publika varianten (där donation är satt)
if (DATA.donation) { $('#stod').href = DATA.donation.url; $('#stod').hidden = false; }

// sidans adress i toppen och på utskrifter, bara när domänen är inställd
if (DATA.doman) {
  document.querySelectorAll('.doman, .utskrift-adress').forEach(el => { el.textContent = DATA.doman; el.hidden = false; });
  document.body.classList.add('har-doman');
}

// ljust/mörkt läge: knappen visar det läge man byter till
const MANE = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11z"/></svg>';
const SOL = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></svg>';
function visaTema() {
  const b = document.getElementById('tema'), m = tema.ar();
  b.innerHTML = m ? SOL : MANE;
  b.title = m ? 'Ljust läge' : 'Mörkt läge';
  b.setAttribute('aria-label', b.title);
  const val = document.getElementById('tema-val');
  if (val) val.textContent = m ? '☀ Ljust läge' : '☾ Mörkt läge';
}
document.getElementById('tema').onclick = () => { tema.byt(); visaTema(); };
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => setTimeout(visaTema));

buildNav();
visaTema();
visa(decodeURIComponent(location.hash.slice(1)));
</script>
